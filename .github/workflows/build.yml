name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # allows attaching the jar to a Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.14 cannot RUN on JDK 25, so we run it on 21 and point its
      # Java toolchain at the installed JDK 25 for compilation (Paper 26.2's
      # required target). JAVA_HOME resolves to the first listed version (21).
      - name: Set up JDK 21 (runner) and JDK 25 (toolchain)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build shaded jar
        run: >
          ./gradlew build --no-daemon --stacktrace
          "-Dorg.gradle.java.installations.paths=$JAVA_HOME_25_X64"
          -Dorg.gradle.java.installations.auto-download=false

      - name: Upload jar as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeCraftManagement-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to the Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" build/libs/*.jar --clobber
