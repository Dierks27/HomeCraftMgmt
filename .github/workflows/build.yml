name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # allows attaching the jar to a Release on tag pushes

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Gradle 8.14 cannot RUN on JDK 25, so Gradle runs on JDK 21 and its Java
      # toolchain is pointed at JDK 25 for compilation (Paper 26.2's target).
      # Two separate setup-java steps: the LAST one installed wins JAVA_HOME, so
      # JDK 21 must come second to be Gradle's runtime. JDK 25's path is captured
      # from the first step's output and handed to the toolchain explicitly.
      - name: Set up JDK 25 (compile toolchain)
        id: jdk25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up JDK 21 (Gradle runtime — sets JAVA_HOME)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build shaded jar
        run: >
          ./gradlew build --no-daemon --stacktrace
          "-Dorg.gradle.java.installations.paths=${{ steps.jdk25.outputs.path }}"
          -Dorg.gradle.java.installations.auto-download=false

      - name: Upload jar as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HomeCraftManagement-jar
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Attach jar to the Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/libs/*.jar \
            --title "$GITHUB_REF_NAME" --generate-notes \
          || gh release upload "$GITHUB_REF_NAME" build/libs/*.jar --clobber

      # On a push to main that carries a NEW project.version, cut the release for
      # it. A version already released is left completely alone.
      #
      # It used to `--clobber` instead, to keep a downloadable build always
      # tracking main without a tag push. That quietly corrupted the release
      # history. The version bump lives in its own release PR, so a FEATURE
      # merge reaches main while project.version still names the PREVIOUS
      # release — and clobbering replaced that release's jar with the newer
      # build. The tag, target and notes stayed correct while the binary behind
      # them moved on, so v0.27.0's download was the v0.28.0 code carrying
      # `version: '0.27.0-the-crate'` in its own plugin.yml.
      #
      # That is worse than a mislabel, because migrations here are forward-only
      # with no down-migrations. Rolling back means restoring the pre-migration
      # database copy AND running the matching jar — and the "matching" jar
      # would have applied the very migration being rolled back, to the
      # database just restored. The one recovery procedure there is did not
      # work as written.
      #
      # The mid-window build is not lost: every run uploads the jar as an
      # Actions artifact. If a downloadable main build is ever wanted again,
      # give it a separate rolling `dev` prerelease tag that may clobber
      # freely, and leave version tags written exactly once.
      - name: Publish Release from main
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          JAR=$(ls build/libs/HomeCraftManagement-*.jar | head -n1)
          VER=$(basename "$JAR" .jar | sed 's/^HomeCraftManagement-//')
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG is already released — leaving its jar untouched."
            echo "Bump project.version in build.gradle to cut a new release."
          else
            gh release create "$TAG" "$JAR" --title "$TAG" \
              --generate-notes --target "$GITHUB_SHA"
          fi
