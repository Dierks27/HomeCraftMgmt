plugins {
    id 'java'
    // Produces the shaded (fat) jar that bundles the SQLite JDBC driver.
    id 'com.gradleup.shadow' version '8.3.5'
}

group = 'com.dierks.homecraft'
version = '0.35.0-arcade-games'
description = 'HomeCraft Management — Paper plugin (market with a live, bounded price mood and Market News, Crate store + Marketplace, Minis and the wild hunt, Card Packs, Courier, web dashboard + website feeds, in-game displays, the Arcade, Sound Mufflers)'

// Target server: Paper 26.2 and 26.3 / Java 25. Compiled against the 26.2 API; the code also
// compiles and passes every test against the 26.3 API (no removals, no new deprecations). The toolchain is pinned to 25 so the
// bytecode matches the live server exactly. If JDK 25 is not installed, Gradle
// will attempt to provision it via the foojay resolver (see settings.gradle).
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'papermc'
        // paper-api is published ONLY here (not on Maven Central).
        url = 'https://repo.papermc.io/repository/maven-public/'
    }
    maven {
        name = 'jitpack'
        // Vault API (com.github.MilkBowl:VaultAPI) is published here.
        url = 'https://jitpack.io'
    }
    maven {
        name = 'placeholderapi'
        // PlaceholderAPI is published only here.
        url = 'https://repo.extendedclip.com/releases/'
    }
}

dependencies {
    // Paper 26.2 API, pinned to a verified-good build for reproducibility. The
    // previous floating 'build.+' selector always grabbed the newest published
    // 26.2 build; when that newest jar came down corrupt on CI ("zip END header
    // not found") the whole compile classpath vanished. Pinning an exact build
    // removes that flakiness — bump it deliberately when a newer build is wanted.
    compileOnly 'io.papermc.paper:paper-api:26.2.build.107-stable'

    // Vault economy abstraction — provided at runtime by the Vault plugin.
    // Exclude VaultAPI's ancient transitive org.bukkit:bukkit:1.13.1 — it is
    // unresolvable and conflicts with paper-api's Bukkit capability. paper-api
    // supplies every Bukkit class we compile against.
    compileOnly('com.github.MilkBowl:VaultAPI:1.7') {
        exclude group: 'org.bukkit', module: 'bukkit'
    }

    // Gson for parsing the web head-library JSON. Provided by the Paper server at
    // runtime, so compileOnly (never shaded) — this just guarantees the compile
    // classpath has it regardless of paper-api's transitive graph.
    compileOnly 'com.google.code.gson:gson:2.11.0'

    // PlaceholderAPI — provided at runtime by the PAPI plugin when present. The
    // expansion is only loaded/registered when PlaceholderAPI is installed, so
    // this is compileOnly (never shaded) and the plugin soft-depends on it.
    compileOnly 'me.clip:placeholderapi:2.11.6'
    // LuckPerms API (Maven Central): the +1 Home perk writes its Essentials home tier through
    // the API rather than console commands, and listens for group changes. compileOnly, never
    // shaded; LuckPerms is a soft dependency and the code that touches it only loads with it.
    compileOnly 'net.luckperms:api:5.4'
    // ProtocolLib (Maven Central): Sound Mufflers reach sounds on their way to each player through
    // it. compileOnly, never shaded; a soft dependency, and only muffler/MufflerPacketListener
    // touches it, loaded only when ProtocolLib is running.
    compileOnly 'net.dmulloy2:ProtocolLib:5.4.0'

    // Bundled at runtime (shaded) so the plugin needs no external DB server.
    implementation 'org.xerial:sqlite-jdbc:3.50.1.0'

    // ---- tests -------------------------------------------------------------
    // The config migration/backfill is exercised against the real Bukkit
    // configuration API (YamlConfiguration is plain Java — no server is started),
    // so paper-api has to be on the TEST classpath as well as compileOnly.
    testImplementation 'io.papermc.paper:paper-api:26.2.build.107-stable'
    // MiniSkin parses the texture JSON with Gson, which is compileOnly for main, so tests need it explicitly.
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def targetJavaVersion = 25

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(targetJavaVersion)
}

processResources {
    def props = [version: project.version]
    inputs.properties(props)
    filteringCharset = 'UTF-8'
    filesMatching('plugin.yml') {
        expand(props)
    }
}

tasks.named('test') {
    useJUnitPlatform()
    // `gradle test -Pslow` also runs the long soaks (@EnabledIfSystemProperty hcm.slow).
    systemProperty 'hcm.slow', project.hasProperty('slow') ? 'true' : 'false'
    // Log every test, so the CI transcript proves the regression tests actually ran —
    // a silently-undiscovered suite would let this fix go green without being checked.
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

shadowJar {
    // Emit the shaded jar as the primary artifact (no '-all' classifier).
    archiveClassifier.set('')
}

// `gradle build` should yield the runnable shaded jar.
tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}
