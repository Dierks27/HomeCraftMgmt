# ---------------------------------------------------------------------
#  Recipes — every craftable HomeCraft block, data-driven and reloadable.
#  All SHAPED 3x3, registered as normal (vanilla) recipes under the plugin's
#  namespace, so they craft at any crafting table and show in the recipe book
#  (unlocked for every player on join — click-to-fill works). `/hcm reload`
#  re-registers them live. Symbols map to a Material, or to an item TAG with a
#  leading `#` (e.g. `#planks`, `#wooden_slabs`, `#wooden_fences` = any of them).
#  Space = empty cell. An empty `shape: []` disables that recipe.
#  The Mini Workbench is retired and deliberately has no recipe.
#  The PC recipe here is also what the Printer's craft grid matches.
# ---------------------------------------------------------------------
recipes:
  pc:
    shape: ["GGG", "CKC", "IQI"]
    ingredients: { G: GLASS_PANE, C: COPPER_BLOCK, K: COMPARATOR, I: IRON_BLOCK, Q: QUARTZ_BLOCK }
  printer:
    shape: ["IHI", "CSC", "PAP"]
    ingredients: { I: IRON_INGOT, H: HOPPER, C: COPPER_BLOCK, S: SMITHING_TABLE, P: PISTON, A: AMETHYST_BLOCK }
  vending:
    shape: ["IGI", "GEG", "IDI"]
    ingredients: { I: IRON_INGOT, G: GLASS, E: EMERALD_BLOCK, D: DISPENSER }
  pallet:
    shape: ["SSS", "TBT", "SSS"]
    ingredients: { S: "#wooden_slabs", T: STICK, B: BARREL }
  arcade:
    shape: ["GNG", "CJC", "RER"]
    ingredients: { G: TINTED_GLASS, N: NOTE_BLOCK, C: COPPER_BLOCK, J: JUKEBOX, R: REDSTONE_BLOCK, E: EMERALD_BLOCK }
  # Display Case pedestal styles: plain (polished deepslate) and royal (gold + red wool).
  display_case:
    plain:
      shape: ["GGG", "G G", "XYX"]
      ingredients: { G: GLASS_PANE, X: POLISHED_DEEPSLATE, Y: POLISHED_DEEPSLATE }
    royal:
      shape: ["GGG", "G G", "XYX"]
      ingredients: { G: GLASS_PANE, X: GOLD_INGOT, Y: RED_WOOL }
  # Filament: one recipe per dye colour (16, all in the recipe book). `<dye>` becomes
  # that colour's dye; `output` filament of the colour per craft. enabled: false turns
  # the whole set off.
  filament:
    enabled: true
    shape: ["SDS", "SLS"]
    ingredients: { S: STRING, D: "<dye>", L: SLIME_BALL }
    output: 3
  # One Mailbox recipe per colour variant: X = that colour's dye (wood = any planks).
  mailbox:
    wood:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: "#planks", I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    light_blue:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: LIGHT_BLUE_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    black:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: BLACK_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    white:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: WHITE_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    purple:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: PURPLE_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    blue:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: BLUE_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    orange:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: ORANGE_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    yellow:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: YELLOW_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }

# ---------------------------------------------------------------------
#  Phase 6 (Part C) — The Market Web Dashboard
#  A live, read-only web page for the Crate market, served by the plugin on its
#  own port (JDK built-in HTTP server — no extra deps). Tunnel the port with a
#  second Playit tunnel for outside access. Read-only: it exposes market data
#  only — never balances or internals. Reloadable with /hcm reload (restarts
#  the server if bind/port/enabled changed).
# ---------------------------------------------------------------------
web:
  dashboard:
    enabled: true
    bind: 0.0.0.0
    port: 8080
    refresh_seconds: 30
    title: "Crate Market"

# ---------------------------------------------------------------------
#  Phase 7 — In-game economy displays (§3.8)
#  Sign boards, holograms (text-display entities), and map-TVs bound to a
#  commodity, re-rendered from the live market on this timer (never per-tick).
#  Bind them in-game (GUI-first): look at a sign / block / framed map, then run
#  the matching /hcm display … command and click the commodity from the picker.
# ---------------------------------------------------------------------
displays:
  refresh_seconds: 20
  # Holograms pair the floating price/trend text with a floating item, turning the
  # ticker into a little market kiosk.
  hologram:
    item_display: true     # show the floating item alongside the text
    position: above        # above | below the text
    spin: true             # slow-spin the floating item
    item: ""               # override Material (blank = the commodity's own item)
    item_scale: 0.3        # size of the floating item (1.0 = full block; ~0.3 reads well)
    text_scale: 1.0        # size of the price/trend text
  # TV price panels: a flat, wall-mounted TextDisplay "screen" bound to a commodity via
  # /hcm display tv <commodity> [scale]. Same content as a sign board (name / price /
  # trend / stock) but big, dark-backed and crisp — no floating items, no maps. It
  # live-updates on the refresh cadence above.
  tv:
    scale: 3.0             # panel size on the wall (the command's [scale] overrides per-panel)

# ---------------------------------------------------------------------
#  Phase 8 — The Arcade (§3.9)
#  A wholesome arcade loop: earn tokens by PLAYING (login streaks + playtime),
#  spend them on weighted loot crates (Mini prizes mint cap-aware through the
#  normal pipeline), buy better odds with a Vault fee, exchange tokens for a
#  guaranteed Rare+ (pity), or scratch a lotto ticket. ALL in-game currency —
#  tokens + Vault money, NEVER real money. Reach it with /hcm arcade or a placed
#  Arcade block (/hcm give arcade). Mini ids below reference the minis: catalog.
# ---------------------------------------------------------------------
arcade:
  enabled: true
  # The placeable Arcade hub block (skin it via skins.arcade).
  block: { material: JUKEBOX, name: "&5Arcade Machine" }
  # Individual machine blocks (crate/scratch/pity/counter) are RETIRED: the Arcade
  # hub block is the only obtainable machine now. Any already-placed machines keep
  # working (these entries still style them) but they are no longer given/crafted.
  machines:
    crate:   { material: CHEST,             name: "&6Crate Machine" }
    scratch: { material: CARTOGRAPHY_TABLE, name: "&aScratch-Ticket Booth" }
    pity:    { material: ENCHANTING_TABLE,  name: "&bPity Exchange" }
    counter: { material: LECTERN,           name: "&eToken Counter" }
  tokens:
    login_streak:
      enabled: true
      # Escalating reward by consecutive-day streak (day1, day2, …); the last entry
      # repeats for longer streaks. One claim per real day. (reward_per_day is a
      # fallback only when this list is empty.)
      rewards: [ 1, 1, 2, 2, 3, 3, 5 ]
      reward_per_day: 1
    playtime:
      enabled: true
      minutes_per_token: 60      # a token per hour played (0 = off)
  # Loot crates: each a token cost + a weighted reward table. TOKENS NEVER BECOME
  # MONEY (§11): a reward may only be card | mini | pack | filament | tokens — a
  # `money` or `item` reward is rejected at load with a warning. `card`/`mini` both
  # hand out that Mini's CARD (fixed `mini:` id, or `tag:` a rarity-weighted pool);
  # `pack: <id>` gives a sealed pack; `filament` gives `amount` (random colour unless
  # `color:`); `tokens` grants `amount` tokens. Cards drop out once capped out.
  crates:
    starter:
      display: "&aStarter Crate"
      cost_tokens: 1
      rewards:
        - { type: card,     tag: starter, weight: 40 }
        - { type: filament, amount: 3,    weight: 30 }
        - { type: pack,     pack: starter, weight: 20 }
        - { type: mini,     tag: starter, weight: 10 }
      # Optional paid-odds tiers: a Vault fee that GUARANTEES a Card at/above `floor`
      # (a strong money sink). Odds are published in the crate GUI.
      paid_odds:
        - { cost_money: 750, floor: RARE }
  # Pity / guaranteed exchange: spend N tokens for a guaranteed Rare+ Mini.
  pity:
    tokens: 25
    guarantees_rarity: RARE      # COMMON | UNCOMMON | RARE | EPIC | LEGENDARY
  # One-time achievements: a token payout the first time a player hits a milestone.
  # Each fires once per player. Toggle/tune reward + display; rich_10k uses threshold.
  achievements:
    first_mini:  { enabled: true, reward: 3, display: "First Mini Collected" }
    first_sale:  { enabled: true, reward: 2, display: "First Market Sale" }
    first_pc:    { enabled: true, reward: 2, display: "Built Your First PC" }
    first_crate: { enabled: true, reward: 1, display: "Opened Your First Crate" }
    first_pack:  { enabled: true, reward: 2, display: "Opened Your First Pack" }
    rich_10k:    { enabled: true, reward: 5, display: "Reached $10,000", threshold: 10000 }
  # Daily/weekly quests: repeatable token objectives that reset each day/week. A quest
  # pays out once per period the moment its progress hits `target`. Each row:
  #   id      - unique key (used to track progress; keep stable)
  #   type    - what to count: SELL_MARKET (money sold), OPEN_CRATE, PRINT_MINI,
  #             OPEN_PACK, SCRATCH (tickets scratched)
  #   target  - amount to reach (money for SELL_MARKET; a count for the others)
  #   reward  - tokens granted on completion
  #   display - the label shown on the Quests board (/hcm quests)
  # Add/remove freely; a mistyped type/id is skipped, not fatal. All in-game currency.
  quests:
    enabled: true
    daily:
      - { id: sell_daily,  type: SELL_MARKET, target: 500,  reward: 2, display: "Sell $500 to the Market" }
      - { id: crate_daily, type: OPEN_CRATE,  target: 1,    reward: 1, display: "Open a Loot Crate" }
      - { id: print_daily, type: PRINT_MINI,  target: 1,    reward: 2, display: "Print a Mini at a Printer" }
    weekly:
      - { id: sell_weekly,  type: SELL_MARKET, target: 5000, reward: 8, display: "Sell $5,000 to the Market" }
      - { id: crate_weekly, type: OPEN_CRATE,  target: 10,   reward: 6, display: "Open 10 Loot Crates" }
      - { id: pack_weekly,  type: OPEN_PACK,   target: 3,    reward: 6, display: "Open 3 Card Packs" }
  # Lotto / scratch ticket: pay money for a weighted-random payout (money sink + hype).
  lotto:
    ticket_cost_money: 250
    payouts:
      - { amount: 0,    weight: 50 }   # a dud
      - { amount: 100,  weight: 30 }
      - { amount: 500,  weight: 15 }
      - { amount: 2000, weight: 5 }
