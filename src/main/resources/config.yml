# =====================================================================
#  HomeCraft Management — configuration
#  Phase 1 wires the `crafting` section fully. `market`, `shipping`, and
#  `minis` are stubs here so the schema is stable for later phases.
#  Recipes are DATA-DRIVEN and RELOADABLE — never hardcoded. Ship empty;
#  nothing is craftable until an admin fills a recipe in. `/hcm reload`
#  re-reads this file and re-registers recipes live.
# =====================================================================

# The online store branding shown in-game (the PC opens this). Both are just
# display text — the URL is not clickable and never resolves.
store:
  name: "Crate"
  display_url: "www.Crate.com"

# Which worlds the ECONOMY runs in (§11 #1 — the creative-world money exploit).
# Outside these worlds: no Market buy/sell, no Marketplace listing/buying, no Card
# Pack purchase, no Printer use, no Vending sales, no auction bids, no wild drops or
# natural spawns, no token earning, and HomeCraft blocks can't be placed (existing
# ones say "the economy is disabled in this world"). On first run the server's main
# world is written here automatically. Pair it with Multiverse-Inventories groups so
# items can't cross from a creative world (see README).
worlds:
  economy_enabled: [world]
  log_blocked_attempts: true    # log every refused attempt with player + world

# SQLite backups (§11 #6). A copy is ALWAYS taken before a schema migration
# (backups/hcm-<timestamp>-pre-migration.db); on top of that a scheduled backup runs
# through SQLite's online backup API and the oldest beyond `keep` are pruned.
# /hcm backup now writes one immediately. Every backup is logged with size + path.
backups:
  enabled: true
  interval_hours: 24
  keep: 14

# Shop presentation. Vending Machines float their upper half as an ItemDisplay
# (flush on the lower head, no gap) with a glow outline visible only to players
# within `radius` (through walls, on purpose), a small hologram listing up to
# `lines` items with prices, and an action-bar "peek" of the listings while your
# crosshair rests on the machine within `peek.range` blocks.
shops:
  glow:
    enabled: true
    radius: 16
    color: { vending: light_purple }   # per block type; named colours or #rrggbb
  hologram: { enabled: true, lines: 3 }
  peek: { range: 6 }

# Written by the plugin: the last config revision applied to this file. Each release
# runs only the steps a file is behind on, so a value you have tuned is never dragged
# back through an earlier step. Don't edit this by hand.
config_revision: 5

# GUI section titles — editable here or live in-game via /hcm admin (Admin Studio).
# No section label is hard-coded. The store title supports {store} and {url}
# tokens (filled from store.name / store.display_url above).
menus:
  admin_title: "&4Admin Studio"
  museum_title: "&5Mini Museum &8&l·&r &7Collectibles"
  market_title: "&1Market — instant buy/sell"
  store_title: "&6Welcome to {store} &8· &7{url}"
  # Where the browsing menus start before a player touches anything. Each player's
  # choices are then remembered for the rest of their session (not saved to disk).
  store:
    # The department tab selected first: All, or any name from marketplace.departments.
    default_department: All
    # NAME | PRICE_UP | PRICE_DOWN | STOCK
    default_sort: NAME
  museum:
    # How the Museum groups Minis: SERIES | RARITY | TYPE
    default_view: SERIES

# The Crate Marketplace (Phase 5): player-run Pallets sell ordinary items online;
# purchases ship to the buyer's Mailbox. (Minis are NOT sold here — they stay on
# the tracked Vending Machine + Auction House.) Obtain the blocks with
# /hcm give <mailbox|pallet>.
marketplace:
  # The Mailbox comes in colour variants (see skins.mailbox + recipes.mailbox);
  # {variant} in the name becomes the colour, e.g. "Blue Mailbox".
  mailbox_block: { material: BARREL, name: "&e{variant} Mailbox" }
  pallet_block:  { material: CHEST,  name: "&6Pallet" }
  fee:
    commission_percent: 8.0     # % of each sale burned as a money sink
    daily_storage_fee: 0.0      # per-Pallet per-day rent (0 = off)
  require_protected_land: true  # a Pallet only works on claimed Towny/WG land
  # Auto-sorted by item property + name; override the exceptions here (MATERIAL: Department).
  # Also the department tabs in the Store and instant Market, so one item sits in the
  # same place wherever a player meets it. Misc (the LAST entry) catches anything the
  # classifier cannot place — watch the "Market departments:" line at startup for a Misc
  # that is growing, and add a category_overrides entry here.
  # EIGHT is the ceiling: the tab row is nine slots and "All" takes the first. A ninth
  # department is still sold and still shows under "All", but it gets no tab of its own,
  # so trim or merge before adding. (Weapons + Armor are one Combat tab for this reason.)
  departments: [ Blocks, Materials, Food, Tools, Combat, Redstone, Collectibles, Misc ]
  category_overrides: {}
  #  ENDER_PEARL: Misc
  # Items that can never be listed (spawn eggs are always banned automatically).
  ban_list: [ BEDROCK, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK,
              COMMAND_BLOCK_MINECART, BARRIER, STRUCTURE_BLOCK, STRUCTURE_VOID, JIGSAW,
              LIGHT, DEBUG_STICK, KNOWLEDGE_BOOK ]

crafting:
  # Respect Towny / WorldGuard build permissions when placing/using/breaking
  # HomeCraft custom blocks. If those plugins are absent this is a no-op.
  respect_town_perms: true

  # ---- The Mini Workbench --------------------------------------------
  # A placeable custom block. Right-click opens the custom crafting GUI
  # where the PC (and, later, craftable Minis) are made.
  workbench:
    # Vanilla base block it is disguised as. Must be a tile-entity block so
    # the placed block can also carry a PDC marker. CRAFTER is thematic.
    base_block: CRAFTER
    display_name: "&6Mini Workbench"
    lore:
      - "&7Right-click to open the crafting bench."
      - "&8HomeCraft Management"
    # Bootstrap recipe for obtaining the Workbench itself, registered as a
    # normal (vanilla) shaped recipe. EMPTY by default = not craftable yet.
    # Fill `shape` (1–3 rows, up to 3 chars each) and map every symbol in
    # `ingredients` to a Material. Space = empty cell.
    recipe:
      shape: []
      ingredients: {}
      # Example (delete the [] above and uncomment to enable):
      # shape:
      #   - "IRI"
      #   - "RCR"
      #   - "IRI"
      # ingredients:
      #   I: IRON_INGOT
      #   R: REDSTONE
      #   C: CRAFTING_TABLE

  # ---- The PC --------------------------------------------------------
  # The gate to the Crate market. Crafted at any crafting table (vanilla recipe,
  # see `recipes.pc` below) or in a Printer's / legacy Workbench's craft grid.
  pc:
    base_block: PLAYER_HEAD
    display_name: "&bPersonal Computer"
    lore:
      - "&7Right-click to open the Amazon store."
      - "&8HomeCraft Management"
    # Legacy computer/monitor head texture. `skins.pc` (below) wins when set; this
    # is only the fallback when that is blank. Kept in sync with skins.pc.
    head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMTQxZWFhNDA2NWUwYjVkMTVmOTA3OGEzZGMyZTZkMzQ0OWUxMjdkN2JjZjFhNmJiM2JmZGNlOGUzYjg4MjYzNiJ9fX0="
    # The PC recipe now lives under `recipes.pc` (below) with every other
    # craftable block — one data-driven loader, registered as vanilla recipes.

# ---------------------------------------------------------------------
#  Phase 9 — The Mini Printer (the ONLY place a Mini is minted).
#  Bring a Card, pay a fee + filament, roll a grade (Gray→Gold), and
#  print a graded Mini. A printer flagged public (via /hcm printer public)
#  is FREE — the house covers filament & fee, basic finishes only (no Shiny).
# ---------------------------------------------------------------------
printer:
  # Vanilla base block it is disguised as (tile-entity so it can carry a PDC tag).
  base_block: SMITHING_TABLE
  display_name: "&bMini Printer"
  lore:
    - "&7Right-click with a Card to print a graded Mini."
    - "&8HomeCraft Management"
  # PRIVATE (home) printers: consume the player's own filament + this money fee
  # (0 = filament only) and offer the Shiny finish.
  fee: 0
  # PUBLIC (Mall) printers: charge this flat money fee, the house covers the
  # filament, no Shiny. Flag a printer public with /hcm printer public.
  public_fee: 150
  # The premium Shiny finish (private printers only): extra filament + fee.
  shiny:
    filament: MAGENTA   # a DyeColor; the Shiny finish consumes this colour
    amount: 2           # units of the above filament (0 = no material cost)
    fee: 25             # extra money on top of the base fee (0 = none)

# ---------------------------------------------------------------------
#  Phase 10 — Card Packs (booster packs; a money sink).
#  Buying a pack charges money and gives N weighted-random CARDS (never
#  Minis — a Card is printed into a Mini later at the Printer). Build/edit
#  packs in-game with /hcm packs (or Admin Studio → Card Packs); this list
#  is kept in sync — no need to edit it by hand.
#    id       unique key
#    display  shown name (&-colour codes ok)
#    price    money per open (Vault)
#    count    how many cards you get per open
#    pool     weighted list of cards (card = a Mini id; weight = relative odds)
# ---------------------------------------------------------------------
packs:
  - id: starter
    display: "Starter Pack"
    price: 250.0
    count: 3
    pool:
      - { card: piggy_mini,  weight: 50 }
      - { card: chick_mini,  weight: 50 }
  - id: premium
    display: "Premium Pack"
    price: 750.0
    count: 3
    pool:
      - { card: piggy_mini,  weight: 45 }
      - { card: chick_mini,  weight: 45 }
      - { card: golden_idol, weight: 1 }    # ≈1.1% per card

# ---------------------------------------------------------------------
#  Phase 2.5 — Finite, conserved commodities market (the "Amazon" side
#  ONLY; QuickShop player-shops set their own prices and are untouched).
#
#  The market holds a REAL, finite stock per commodity. Selling ADDS to
#  stock; buying SUBTRACTS. Stock never goes negative. Price is a function
#  of stock: empty (0) = ceiling price AND out of stock; full = floor price.
# ---------------------------------------------------------------------
market:
  # Price curve shape. price = floor + (ceiling-floor) * (1 - stock/full_stock)^elasticity
  #   1.0 = linear from ceiling (empty) down to floor (full).
  #   > 1 = stays cheap once decently stocked, spikes only near empty.
  #   < 1 = stays pricey until nearly full. Range > 0.
  elasticity: 1.0
  # Glide smoothing: each trade the price moves (1 - inertia) of the way to
  # the stock-implied target, so it eases in instead of snapping. Range [0, 1).
  inertia: 0.2
  # Bid/ask spread: the market SELLS to you slightly above, and BUYS from you
  # slightly below, the mid price — kills round-trip arbitrage. 0.10 = ±5%.
  spread: 0.10
  # Stock level at which price reaches the floor, for items that don't set
  # their own full_stock.
  default_full_stock: 1024

  # Daily per-player SELL limit (anti-whale): caps how much a player can sell
  # to the market per UTC day. Resets daily; tracked in SQLite. Per-item
  # `max_daily_sell` overrides in the catalog stack ON TOP of this (tighter wins).
  sell_limits:
    enabled: true
    max_money_per_day: 5000     # 0 = unlimited money/day
    max_units_per_day: 0        # 0 = unlimited units/day (counted per item)
    bypass_permission: "hcm.market.limit.bypass"
    # Optional higher ceilings per LuckPerms-managed permission node. The most
    # generous node the player holds wins. Grant these via LuckPerms.
    ranks:
      - permission: "hcm.market.limit.vip"
        max_money_per_day: 12500
        max_units_per_day: 0

  # Daily per-player BUY limit (anti-drain / anti-hoard): the sell-side mirror —
  # caps how much a player can buy from the market per UTC day so no one drains a
  # commodity's supply the moment it's stocked. Same shape and semantics as
  # sell_limits; the shared bypass permission skips both. Per-item `max_daily_buy`
  # overrides in the catalog stack ON TOP of this (tighter wins). Tracked separately
  # in SQLite; resets at UTC midnight. Also applies to Crate/Amazon store orders.
  buy_limits:
    enabled: true
    max_money_per_day: 5000     # 0 = unlimited money/day
    max_units_per_day: 0        # 0 = unlimited units/day (counted per item)
    bypass_permission: "hcm.market.limit.bypass"
    ranks:
      - permission: "hcm.market.limit.vip"
        max_money_per_day: 12500
        max_units_per_day: 0

  # Periodic price/stock snapshots (feed the Phase 5 web dashboard charts).
  price_history:
    interval_minutes: 30

  # Admin-defined catalog. Each item:
  #   id            unique key used in commands (lower-case)
  #   material      a Bukkit Material (what is bought/sold)
  #   display_name  optional pretty name (&-colour codes)
  #   floor         lowest price (reached when stock is at/above full_stock)
  #   ceiling       highest price (reached at zero stock; also = out of stock)
  #   initial_stock starting units the market holds (sets the starting price)
  #                 MUST be strictly LESS than full_stock — see the hard rule below
  #   full_stock    units at which price hits the floor (default: default_full_stock)
  #   max_daily_sell optional per-player, per-item, per-day SELL cap (0/omitted = none)
  #   max_daily_buy  optional per-player, per-item, per-day BUY cap  (0/omitted = none)
  # Per-item caps stack ON TOP of the global sell_limits/buy_limits (tighter wins) and
  # are skipped by the bypass permission. Rule of thumb: max_daily_sell ~= 2% of
  # full_stock, max_daily_buy ~= 4% of full_stock, so no single player can move a
  # price more than a few percent per day. Set tight caps on rare items, high (or
  # none) on commons.
  # Staples seed with generous stock (cheap & available from day one); ores can
  # start at 0 → pinned at ceiling and UNBUYABLE until players sell some in.
  #
  # HARD RULE — stock must never reach full_stock. full_stock is the DENOMINATOR of
  # the price curve, not a target to hit: the market has to keep room for players to
  # sell into, or an item lands on the floor with nowhere left to go. So:
  #   * initial_stock >= full_stock is clamped to full_stock * 0.85 with a warning.
  #   * /hcm market setstock refuses to seat stock at/above full_stock (caps at -1).
  #   * A player CAN still sell stock up to full_stock — the item then sits at floor
  #     price and further sells earn almost nothing. That's the market's own signal
  #     saying "we're saturated, go sell something else."
  #
  # Edit + /hcm reload: existing stock/price is preserved on purpose, so changing
  # initial_stock/full_stock alone will NOT move an item that already exists; new items
  # seed fresh. To apply a NEW economy design to items already in the database, run
  # `/hcm market resetstock all` (or `<item>`) — that reseeds stock from config AND
  # snaps every price back onto the curve instead of letting inertia glide there.
  catalog:
    - id: cobblestone
      material: COBBLESTONE
      display_name: "&7Cobblestone"
      floor: 0.10
      ceiling: 5.0
      initial_stock: 17000    # MUST stay < full_stock (85% here) — see the rule above
      full_stock: 20000
      max_daily_sell: 400     # common — high volume allowed (~2% of full_stock)
      max_daily_buy: 800      # ~4% of full_stock
    - id: oak_log
      material: OAK_LOG
      display_name: "&6Oak Log"
      floor: 1.0
      ceiling: 20.0
      initial_stock: 4000
      full_stock: 8000
      max_daily_sell: 160     # ~2% of full_stock
      max_daily_buy: 320      # ~4%
    - id: wheat
      material: WHEAT
      display_name: "&eWheat"
      floor: 1.0
      ceiling: 12.0
      initial_stock: 3000
      full_stock: 6000
      max_daily_sell: 120
      max_daily_buy: 240
    - id: iron_ingot
      material: IRON_INGOT
      display_name: "&fIron Ingot"
      floor: 4.0
      ceiling: 40.0
      initial_stock: 512
      full_stock: 2048
      max_daily_sell: 40
      max_daily_buy: 80
    - id: gold_ingot
      material: GOLD_INGOT
      display_name: "&6Gold Ingot"
      floor: 20.0
      ceiling: 150.0
      initial_stock: 0          # starts empty -> ceiling price, out of stock
      full_stock: 1024
      max_daily_sell: 20
      max_daily_buy: 40
    - id: diamond
      material: DIAMOND
      display_name: "&bDiamond"
      floor: 60.0
      ceiling: 400.0
      initial_stock: 0          # starts empty -> ceiling price, out of stock
      full_stock: 512
      max_daily_sell: 10        # rare — tight cap protects supply (~2% of full_stock)
      max_daily_buy: 20         # ~4% of full_stock — prevents hoarding

# Phase 3 / 6 — Crate Ordering + Shipping
# Tiers are FULLY config-driven: add / rename / re-time any number of them and
# the checkout GUI renders them automatically (fastest → slowest). Each tier's
# real-time delivery delay is `real_hours` + `real_minutes` combined — use
# `real_minutes` alone for a sub-hour tier (Express delivers ~5 real minutes
# after ordering). Both accept decimals. An optional `label:` overrides the
# auto-generated display name.
shipping:
  # In PERCENTAGE mode every tier charges `percent` of the item total (faster =
  # higher %). `flat`/`prime_flat` apply ONLY in FLAT mode. A slower tier is also
  # clamped to never cost more than a faster one.
  mode: PERCENTAGE     # PERCENTAGE | FLAT
  tiers:
    express:   { real_minutes: 5, percent: 20 }   # fastest / most expensive
    one_day:   { real_hours: 1,   percent: 10 }
    two_day:   { real_hours: 3,   percent: 5  }
    three_day: { real_hours: 8,   percent: 0  }   # free
  locker: { enabled: true }

# ---------------------------------------------------------------------
#  Phase 4 — Minis (collectible heads & armor stands)
#  You assign each Mini a rarity + (optionally) a cap/price; the colour,
#  glint, and smart defaults follow from the rarity palette below. Edit the
#  palette once instead of styling every Mini. Everything reloads with
#  /hcm reload. The catalog is hand-picked — add only what you want.
# ---------------------------------------------------------------------
minis:
  pricing_mode: ESCALATING   # FIXED | ESCALATING (informational; per-entry price wins)

  # Assign the tier; colour + glint + default cap/price come from here.
  rarity_styles:
    LEGENDARY: { pane: YELLOW,     name_color: gold,         glint: true,  default_cap: 5,   default_price: 50000 }
    EPIC:      { pane: PURPLE,     name_color: light_purple, glint: true,  default_cap: 20,  default_price: 15000 }
    RARE:      { pane: BLUE,       name_color: aqua,         glint: false, default_cap: 100, default_price: 4000 }
    UNCOMMON:  { pane: GREEN,      name_color: green,        glint: false, default_cap: 500, default_price: 800 }
    COMMON:    { pane: LIGHT_GRAY, name_color: gray,         glint: false, default_cap: -1,  default_price: 150 }

  # Your "Type" list (the subject) — open/editable, used for browsing/filtering.
  categories: [ ANIMAL, FOOD, LETTER, SYMBOL, CHARACTER, VEHICLE, HOLIDAY, MISC ]

  # The catalog. Each entry inherits its series' rarity unless it sets its own;
  # cap/price default from the rarity palette. `texture` is a Base64 head value
  # (from minecraft-heads.com's "Value" field) — leave blank for a plain head.
  # `id` is optional (auto-derived from the name if omitted). `tags: [mining, fish]`
  # puts the Mini into those wild-drop tag pools (see loot: below) — an untagged Mini
  # never drops from a tag pool. Optional per-entry `card:` sets card cap / grade odds
  # (standard / graded / mint) / filament; otherwise they derive from the rarity.
  series:
    - name: "Starter Critters"
      rarity: COMMON
      entries:
        - { name: "Piggy Mini",  category: ANIMAL, tags: [starter, mining, zombie], texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYTlhOTIxMmQzNmMwY2E3ZjA1MzczNzZmYWI1Yjg0ZWNiN2FmNjZjZjY3NTRlN2I4N2Q4YjFhMDhkOWQ1NDAyYiJ9fX0=" }
        - { name: "Chick Mini",  category: ANIMAL, tags: [starter, mining, fish], texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNzAzMWE5ODI2NTUyOGMwNDAxMjEzNTJkNWRhYTc4ODFhMjI1YjIyNGQ3ZDVlYmRmNjUyNzliYTgzODQ2OTZmYSJ9fX0=" }
    - name: "Legendary Relics"
      rarity: LEGENDARY
      entries:
        - { name: "Golden Idol", category: SYMBOL, tags: [mining], texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMWU1YmY2MDM2Mzg2YjJlYjAwZmMyZTYzNWU1NzViNzRlMmI1YTBjNjljYmI1MzY5MWFlZGZkYjZhMGMzNjAwOSJ9fX0=", cap: 5 }

  # ---- Grades (Phase 12). Rarity owns a Mini's colour + glint; the GRADE owns the
  # stars: a star suffix on the name ("Chick Mini ★★") and a lore line, never a
  # competing colour. Three grades, rolled at the Printer (and by wild drops / crates)
  # from the Mini's card odds. Names, symbols and value multipliers are yours to edit.
  # Old copies printed under the retired five-grade ladder migrate on sight:
  # Gray/Green → STANDARD, Blue/Purple → GRADED, Gold → MINT.
  grades:
    STANDARD: { name: "Standard", symbol: "☆",   multiplier: 1.0 }
    GRADED:   { name: "Graded",   symbol: "★★",  multiplier: 2.5 }
    MINT:     { name: "Mint",     symbol: "★★★", multiplier: 6.0 }

  # ---- World effects (Phase 12) for PLACED Minis — Display Case trophies, posed
  # armor-stand Minis, and natural wild spawns — by rarity. One repeating task serves
  # every placed Mini, skipping any with no player within `radius` blocks and any in
  # an unloaded chunk. Everything is torn down on removal / chunk unload / disable and
  # rebuilt from the datastore on load, so nothing leaks after a crash.
  #   particle:  type (a Particle name or none), count, interval_ticks, offset
  #   hologram:  a floating name (TextDisplay) in `color` (a named colour or #hex)
  #   light:     a hidden LIGHT block in the nearest air neighbour at `level`
  #   rotate:    a slowly turning ItemDisplay above a case (`degrees_per_second`);
  #              armor-stand Minis turn in place instead
  #   full_bright: the ItemDisplay ignores world light (Legendary)
  #   place_sound / place_particle: played once when the Mini is placed
  # Grade MINT copies play `mint_sound` on print and on place; Shiny copies add a ring
  # of `shiny_particle` on top of their rarity effect.
  effects:
    radius: 16              # only Minis with a player this close get effects
    tick_interval: 10       # task cadence in ticks (particles use their own interval)
    mint_sound: BLOCK_AMETHYST_BLOCK_CHIME
    shiny_particle: GLOW
    wild_hologram_text: "&dA wild Mini!"
    case_item_scale: 0.6    # size of the Mini floating above a Display Case
    case_item_height: 0.9   # how high above the case block it floats
    COMMON: {}
    UNCOMMON: {}
    RARE:
      particle: { type: END_ROD, count: 2, interval_ticks: 40, offset: 0.3 }
      hologram: { enabled: true, color: aqua }
      light:    { enabled: true, level: 7 }
      rotate:   { enabled: true, degrees_per_second: 20 }
      full_bright: false
    EPIC:
      particle: { type: ENCHANT, count: 6, interval_ticks: 20, offset: 0.4 }
      hologram: { enabled: true, color: light_purple }
      light:    { enabled: true, level: 7 }
      rotate:   { enabled: true, degrees_per_second: 20 }
      full_bright: false
    LEGENDARY:
      particle: { type: SOUL_FIRE_FLAME, count: 3, interval_ticks: 30, offset: 0.4 }
      hologram: { enabled: true, color: gold }
      light:    { enabled: true, level: 12 }
      rotate:   { enabled: true, degrees_per_second: 20 }
      full_bright: true
      place_sound: ITEM_TOTEM_USE
      place_particle: TOTEM_OF_UNDYING

  # ---- Announcements (Phase 12). One server-wide line when a Mini is FOUND (wild
  # drop, natural spawn, crate — never the Printer or a pack); the [name] is a hover
  # card showing the item's full tooltip and click-runs /hcm museum <id>. A SPAWN HINT
  # when a natural spawn lands ("A <Rarity> Mini has spawned within 100 blocks of a
  # player!") — never coordinates, never who — and a "slipped away" line if it
  # despawns untouched. Every broadcast plays `sound` to everyone. `min_rarity` and
  # `per_rarity` silence chat for tiers you don't want announced.
  announce:
    enabled: true
    found: true
    spawn_hint: true
    slipped_away: true
    min_rarity: COMMON      # COMMON | UNCOMMON | RARE | EPIC | LEGENDARY
    hint_radius_text: "within 100 blocks of a player"
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    per_rarity: { COMMON: true, UNCOMMON: true, RARE: true, EPIC: true, LEGENDARY: true }

  # ---- Trading blocks (Phase 4c) — appearance of the placeable custom blocks.
  # Obtain with /hcm give <vending|display|auction>. The Display Case should stay
  # a PLAYER_HEAD so it can render the loaded Mini as a trophy.
  blocks:
    vending_machine: { material: BARREL,     name: "&dMini Vending Machine" }
    display_case:    { material: PLAYER_HEAD, name: "&b{variant} Display Case" }   # {variant} = Plain / Royal
    auction_house:   { material: LECTERN,    name: "&6Mini Auction House" }

  # ---- Auction House tuning (Phase 4c).
  auction:
    min_increment: 1.0          # smallest raise over the current bid
    anti_snipe_seconds: 15      # a bid within this window of the end extends the timer
    max_duration_minutes: 10080 # 7 days

  # ---- Wild Drops (Phase 4c / 12). A source ties a trigger (BLOCK_BREAK | MOB_KILL |
  # FISHING | NATURAL_SPAWN) + a match (material / entity, or * for any) to a POOL with
  # a percentage chance — `chance_percent: 0.02` means 0.02% (about one per 5,000
  # rolls). The pool is either `list: <id>` (a weighted bag of Mini ids, below) or
  # `tag: <name>` (every catalog Mini carrying that tag, weighted by rarity via
  # rarity_weights; untagged Minis never drop). A drop MINTS a finished Mini — grade
  # rolled from the Mini's Printer odds (or the source's `grades:` override) and a
  # Shiny roll at shiny_percent (or the source's `shiny_percent`) — so it respects the
  # cap, counts toward circulation, and is announced. Block-break sources must name a
  # material (anti-farm). NATURAL_SPAWN sources fire every natural.interval_ticks for
  # each online player and place the Mini as a head 24–48 blocks away instead of
  # handing it over. Empty by default — nothing drops until you configure it.
  loot:
    # Tag-pool odds by rarity (relative weights).
    rarity_weights: { LEGENDARY: 1, EPIC: 4, RARE: 15, UNCOMMON: 40, COMMON: 100 }
    # Chance (%) that a found Mini is Shiny; sources may override with shiny_percent.
    shiny_percent: 5
    # Natural spawns: cadence, lifetime before it slips away, and distance from a player.
    natural:
      interval_ticks: 12000   # 10 minutes
      despawn_minutes: 10
      min_distance: 24
      max_distance: 48
    lists: []
    #  - id: common_blocks
    #    entries:
    #      - { mini: piggy_mini, weight: 10 }
    sources: []
    # Example sources (uncomment to enable — the shipped Minis carry these tags):
    #  - { trigger: BLOCK_BREAK,   match: STONE,  tag: mining, chance_percent: 0.02 }   # ~1 per 5,000 stone
    #  - { trigger: MOB_KILL,      match: ZOMBIE, tag: zombie, chance_percent: 1 }
    #  - { trigger: FISHING,       match: "*",    tag: fish,   chance_percent: 0.5 }
    #  - { trigger: NATURAL_SPAWN, match: "*",    tag: mining, chance_percent: 3 }      # 3% per 10-minute tick, per player
    # Per-source overrides: grades: { standard: 60, graded: 30, mint: 10 } and shiny_percent: 10

  # ---- Posed armor-stand Minis (Phase 4d). Authored in-game: pose a real armor
  # stand, then `/hcm mini capturestand <miniId>` while looking at it. Poses are in
  # degrees; equipment is stored as Base64 items. Empty by default.
  stands: []
  #  - id: my_statue
  #    small: false
  #    arms: true
  #    base_plate: true
  #    invisible: false
  #    pose: { head: [0,0,0], body: [0,0,0], left_arm: [0,0,0], right_arm: [0,0,0], left_leg: [0,0,0], right_leg: [0,0,0] }
  #    equipment: { helmet: "", chest: "", legs: "", boots: "", main_hand: "", off_hand: "" }

