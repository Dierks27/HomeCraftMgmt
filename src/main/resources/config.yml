# =====================================================================
#  HomeCraft Management — configuration
#  Phase 1 wires the `crafting` section fully. `market`, `shipping`, and
#  `minis` are stubs here so the schema is stable for later phases.
#  Recipes are DATA-DRIVEN and RELOADABLE — never hardcoded. Ship empty;
#  nothing is craftable until an admin fills a recipe in. `/hcm reload`
#  re-reads this file and re-registers recipes live.
# =====================================================================

# The online store branding shown in-game (the PC opens this). Both are just
# display text — the URL is not clickable and never resolves.
store:
  name: "Crate"
  display_url: "www.Crate.com"

# Which worlds the ECONOMY runs in (§11 #1 — the creative-world money exploit).
# Outside these worlds: no Market buy/sell, no Marketplace listing/buying, no Card
# Pack purchase, no Printer use, no Vending sales, no auction bids, no wild drops or
# natural spawns, no token earning, and HomeCraft blocks can't be placed (existing
# ones say "the economy is disabled in this world"). On first run the server's main
# world is written here automatically. Pair it with Multiverse-Inventories groups so
# items can't cross from a creative world (see README).
worlds:
  economy_enabled: [world]
  log_blocked_attempts: true    # log every refused attempt with player + world

# SQLite backups (§11 #6). A copy is ALWAYS taken before a schema migration
# (backups/hcm-<timestamp>-pre-migration.db); on top of that a scheduled backup runs
# through SQLite's online backup API and the oldest beyond `keep` are pruned.
# /hcm backup now writes one immediately. Every backup is logged with size + path.
backups:
  enabled: true
  interval_hours: 24
  keep: 14

# Shop presentation. Vending Machines float their upper half as an ItemDisplay
# (flush on the lower head, no gap) with a glow outline visible only to players
# within `radius` (through walls, on purpose), a small hologram listing up to
# `lines` items with prices, and an action-bar "peek" of the listings while your
# crosshair rests on the machine within `peek.range` blocks.
shops:
  glow:
    enabled: true
    radius: 16
    color: { vending: light_purple }   # per block type; named colours or #rrggbb
  hologram: { enabled: true, lines: 3 }
  peek: { range: 6 }

# The players' clock. The login streak, daily and weekly quests, and every Arcade
# "per day" / "per week" limit roll over at MIDNIGHT IN THIS ZONE — not at UTC midnight,
# which is 7 PM in Minnesota (6 PM in winter), right in the middle of evening play.
# Any region name Java knows (America/Chicago, Europe/London, …). Blank or unknown falls
# back to UTC with a warning in the log.
# (The market's and the Courier's daily limits still roll over at UTC midnight — they
# are money limits and are deliberately not moved by this.)
clock:
  time_zone: America/Chicago

# Written by the plugin: the last config revision applied to this file. Each release
# runs only the steps a file is behind on, so a value you have tuned is never dragged
# back through an earlier step. Don't edit this by hand.
config_revision: 16

# GUI section titles — editable here or live in-game via /hcm admin (Admin Studio).
# No section label is hard-coded. The store title supports {store} and {url}
# tokens (filled from store.name / store.display_url above).
menus:
  admin_title: "&4Admin Studio"
  museum_title: "&5Mini Museum &8&l·&r &7Collectibles"
  market_title: "&1Sell to Crate"
  store_title: "&6Welcome to {store} &8· &7{url}"
  # The PC's root screen — the Site launcher (§2.2). The PC is a browser and each
  # feature is a Site you open on it; this is the address bar, not a shop front.
  pc_title: "&9PC &8· &7{url}"
  # Where the browsing menus start before a player touches anything. Each player's
  # choices are then remembered for the rest of their session (not saved to disk).
  store:
    # The department tab selected first: All, or any name from marketplace.departments.
    default_department: All
    # NAME | PRICE_UP | PRICE_DOWN | STOCK
    default_sort: NAME
  museum:
    # How the Museum groups Minis: SERIES | RARITY | TYPE
    default_view: SERIES

# The Crate Marketplace (Phase 5): player-run Pallets sell ordinary items online;
# purchases ship to the buyer's Mailbox. (Minis are NOT sold here — they stay on
# the tracked Vending Machine + Auction House.) Obtain the blocks with
# /hcm give <mailbox|pallet>.
marketplace:
  # The Mailbox comes in colour variants (see skins.mailbox + recipes.mailbox);
  # {variant} in the name becomes the colour, e.g. "Blue Mailbox".
  mailbox_block: { material: BARREL, name: "&e{variant} Mailbox" }
  pallet_block:  { material: CHEST,  name: "&6Pallet" }
  fee:
    commission_percent: 8.0     # % of each sale burned as a money sink
    daily_storage_fee: 0.0      # per-Pallet per-day rent (0 = off)
  require_protected_land: true  # a Pallet only works on claimed Towny/WG land
  # Auto-sorted by item property + name; override the exceptions here (MATERIAL: Department).
  # Also the department tabs in the Store and instant Market, so one item sits in the
  # same place wherever a player meets it. Misc (the LAST entry) catches anything the
  # classifier cannot place — watch the "Market departments:" line at startup for a Misc
  # that is growing, and add a category_overrides entry here.
  # EIGHT is the ceiling: the tab row is nine slots and "All" takes the first. A ninth
  # department is still sold and still shows under "All", but it gets no tab of its own,
  # so trim or merge before adding. (Weapons + Armor are one Combat tab for this reason.)
  departments: [ Blocks, Materials, Food, Tools, Combat, Redstone, Collectibles, Misc ]
  category_overrides: {}
  #  ENDER_PEARL: Misc
  # Items that can never be listed (spawn eggs are always banned automatically).
  ban_list: [ BEDROCK, COMMAND_BLOCK, CHAIN_COMMAND_BLOCK, REPEATING_COMMAND_BLOCK,
              COMMAND_BLOCK_MINECART, BARRIER, STRUCTURE_BLOCK, STRUCTURE_VOID, JIGSAW,
              LIGHT, DEBUG_STICK, KNOWLEDGE_BOOK ]

crafting:
  # Respect Towny / WorldGuard build permissions when placing/using/breaking
  # HomeCraft custom blocks. If those plugins are absent this is a no-op.
  respect_town_perms: true

  # ---- The Mini Workbench --------------------------------------------
  # A placeable custom block. Right-click opens the custom crafting GUI
  # where the PC (and, later, craftable Minis) are made.
  workbench:
    # Vanilla base block it is disguised as. Must be a tile-entity block so
    # the placed block can also carry a PDC marker. CRAFTER is thematic.
    base_block: CRAFTER
    display_name: "&6Mini Workbench"
    lore:
      - "&7Right-click to open the crafting bench."
      - "&8HomeCraft Management"
    # Bootstrap recipe for obtaining the Workbench itself, registered as a
    # normal (vanilla) shaped recipe. EMPTY by default = not craftable yet.
    # Fill `shape` (1–3 rows, up to 3 chars each) and map every symbol in
    # `ingredients` to a Material. Space = empty cell.
    recipe:
      shape: []
      ingredients: {}
      # Example (delete the [] above and uncomment to enable):
      # shape:
      #   - "IRI"
      #   - "RCR"
      #   - "IRI"
      # ingredients:
      #   I: IRON_INGOT
      #   R: REDSTONE
      #   C: CRAFTING_TABLE

  # ---- The PC --------------------------------------------------------
  # The gate to the Crate market. Crafted at any crafting table (vanilla recipe,
  # see `recipes.pc` below) or in a Printer's / legacy Workbench's craft grid.
  pc:
    base_block: PLAYER_HEAD
    display_name: "&bPersonal Computer"
    lore:
      - "&7Right-click to open the store."
      - "&8HomeCraft Management"
    # Legacy computer/monitor head texture. `skins.pc` (below) wins when set; this
    # is only the fallback when that is blank. Kept in sync with skins.pc.
    head_texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMTQxZWFhNDA2NWUwYjVkMTVmOTA3OGEzZGMyZTZkMzQ0OWUxMjdkN2JjZjFhNmJiM2JmZGNlOGUzYjg4MjYzNiJ9fX0="
    # The PC recipe now lives under `recipes.pc` (below) with every other
    # craftable block — one data-driven loader, registered as vanilla recipes.

# ---------------------------------------------------------------------
#  Phase 9 — The Mini Printer (the ONLY place a Mini is minted).
#  Bring a Card, pay a fee + filament, roll a grade (Gray→Gold), and
#  print a graded Mini. A printer flagged public (via /hcm printer public)
#  is FREE — the house covers filament & fee, basic finishes only (no Shiny).
# ---------------------------------------------------------------------
printer:
  # Vanilla base block it is disguised as (tile-entity so it can carry a PDC tag).
  base_block: SMITHING_TABLE
  display_name: "&bMini Printer"
  lore:
    - "&7Right-click with a Card to print a graded Mini."
    - "&8HomeCraft Management"
  # PRIVATE (home) printers: consume the player's own filament + this money fee
  # (0 = filament only) and offer the Shiny finish.
  fee: 0
  # PUBLIC (Mall) printers: charge this flat money fee, the house covers the
  # filament, no Shiny. Flag a printer public with /hcm printer public.
  public_fee: 150
  # The premium Shiny finish (private printers only): extra filament + fee.
  shiny:
    filament: MAGENTA   # a DyeColor; the Shiny finish consumes this colour
    amount: 2           # units of the above filament (0 = no material cost)
    fee: 25             # extra money on top of the base fee (0 = none)

# ---------------------------------------------------------------------
#  Card Packs (§3.5). Open a pack, get a Card, print it into a Mini.
#  A pack is bought sealed (for dollars, tokens, or either) and opened with a
#  right-click; it gives CARDS, never Minis — a Card is printed into a Mini at a
#  Printer. Build/edit packs in-game with /hcm packs (Admin Studio → Card Packs);
#  this list is kept in sync, so there's no need to edit it by hand.
#    id            unique key
#    display       shown name (&-colour codes ok)
#    price         dollars (0 = not sold for dollars)
#    price_tokens  tokens (0 = not sold for tokens)
#    count         Cards per pack. A pack that can only fill some of them refunds
#                  the rest's share in whatever currency paid for it.
#    tag           optional: only Minis with this tag (blank = every Mini)
#    rarity_odds   relative odds per rarity. A rarity with no Cards left drops out
#                  and the rest scale up; if nothing is left the pack is Sold out.
#                  New Minis join automatically — no list to keep up to date.
#    pool          optional hand-picked list ({ card: <mini id>, weight: N });
#                  when present it is used INSTEAD of rarity_odds.
# ---------------------------------------------------------------------
packs:
  - id: starter
    display: "&aStarter Pack"
    price: 100
    price_tokens: 50
    count: 1
    tag: ""
    rarity_odds: { COMMON: 62, UNCOMMON: 28, RARE: 9, EPIC: 1, LEGENDARY: 0 }
  - id: premium
    display: "&dPremium Pack"
    price: 300
    price_tokens: 0
    count: 1
    tag: ""
    rarity_odds: { COMMON: 0, UNCOMMON: 45, RARE: 38, EPIC: 13, LEGENDARY: 4 }

# ---------------------------------------------------------------------
#  Courier — paid delivery runs (Phase 1: economy only, no world changes).
#
#  A player takes a job from the Courier Site on the PC, travels to a waypoint,
#  and is paid on DISTANCE and TRAVEL METHOD. The payout locks at acceptance, so
#  running in circles earns nothing.
#
#  Why it pays what it pays: per §3.1 material enters the house market ONLY when
#  players mine and sell it in. If deliveries paid as well as mining, mining stops
#  and the market starves. So a full day of runs sits meaningfully BELOW a mining
#  session per minute and is still worth doing — five jobs at band midpoints, all
#  on foot, is about $93 against a ~$150 mining day for slightly more wall-clock
#  time. Do not raise these without re-checking that relationship.
# ---------------------------------------------------------------------
courier:
  enabled: true
  # travel_fee = (base + per_block * distance) * travel_multiplier
  # distance is the horizontal straight line from where the job was accepted to
  # the waypoint, clamped to [min_distance, max_distance].
  payout:
    base: 4.0
    per_block: 0.012
    min_distance: 200
    max_distance: 4000
  # How much of the fee each way of travelling is worth. Vanilla movement
  # statistics are snapshotted at accept and diffed at turn-in, then blended by the
  # FRACTION of centimetres moved in each group — never a total. A player who runs
  # the route once and one who runs it four times both score 1.00.
  #   foot     WALK / SPRINT / CROUCH / SWIM / WALK_ON_WATER / WALK_UNDER_WATER / CLIMB
  #   mount    HORSE / STRIDER / PIG / NAUTILUS  (a Nautilus is a tameable saddled
  #            mount like a Strider, not a boat — hence 0.85 rather than 0.80)
  #   boat     BOAT
  #   rail     MINECART
  #   elytra   AVIATE
  #   ghast    HAPPY_GHAST — it flies, so it removes more effort than a horse, but
  #            it is slow and a real investment to get one
  #   creative FLY (creative flight earns nothing)
  travel:
    foot: 1.00
    mount: 0.85
    boat: 0.80
    ghast: 0.70
    rail: 0.65
    elytra: 0.45
    creative: 0.00
  # Anti-teleport: if total tracked movement comes to less than `floor` of the
  # locked straight-line distance, the travel fee pays `payout` instead. Cargo value
  # on a trade run still pays in full. Logged at debug, never called out in chat —
  # the smaller number is the message.
  anti_teleport:
    floor: 0.70
    payout: 0.20
  # Distance bands and how many of each a player may run per UTC day. Keyed by
  # epoch-day at read time like every other daily tally here — no scheduler.
  bands:
    local:     { min: 200,  max: 600,  per_day: 2 }
    regional:  { min: 600,  max: 1800, per_day: 2 }
    long_haul: { min: 1800, max: 4000, per_day: 1 }
  # An accepted job left unfinished this long is abandoned and its slot returned.
  expire_minutes: 60
  # How close to the waypoint counts as arriving. This is the fallback route — the
  # normal way to finish is the villager at the delivery building — and it stays
  # enabled on purpose so a failed placement never strands anyone 1,800 blocks out.
  turn_in_radius: 10
  # Waypoint generation: a random bearing and distance from the player, resolved to
  # the highest solid block. A spot is rejected if it is liquid, in an ocean biome,
  # or on Towny/WorldGuard claimed land; after `max_rerolls` the job is not offered
  # rather than placed somewhere unreachable.
  waypoint:
    max_rerolls: 20
  # ---- The package ----------------------------------------------------
  # A courier run hands you a crate to carry. Trade runs do not get one — the
  # cargo IS the player's own goods, which is the point of that kind of run.
  #
  # The crate is worth nothing and must stay worth nothing: anything that survives
  # its job is an item you could mint on demand by taking Courier work, in an
  # economy whose premise is that material only enters when somebody mines it. So
  # it cannot be placed, worn, stacked, listed on a Pallet, or carried into another
  # job, and it is destroyed the moment the delivery ends by any route. A crate
  # belonging to a job that is over is removed on sight.
  #
  # It is a player head, and so is a Mini — they are told apart by their PDC keys
  # and never by looking like a head, so nothing that handles Minis can ever pick
  # one up by mistake.
  package:
    enabled: true
    name: "&6Delivery Crate"
    # Dropped on death by default: the grave is the recovery path, and losing it is
    # a real consequence rather than a bug. Turn this on to be kinder to the
    # younger players.
    keep_on_death: false
    # What losing the crate costs, as a multiple of what the run would have paid on
    # foot. At 1.0 a lost crate cancels the run out: you walked it for nothing.
    #
    # The crate is worthless, so this is not compensation for an item — it is the
    # only reason carrying one is a responsibility rather than a decoration. It is
    # charged when the run ends WITHOUT the crate coming back, never merely for
    # failing the run, and the same figure buys a replacement at any PC so a lost
    # crate does not strand a delivery.
    #
    # What cannot be paid becomes debt, which blocks the courier board (and nothing
    # else) until it is cleared. Set to 0 to turn the fee and the debt off entirely.
    loss_multiplier: 1.0
  # ---- The destination (Phase 2) --------------------------------------
  # A small house appears at the waypoint with a villager outside it. Right-click
  # the villager to hand the cargo over. When the run ends — delivered, expired,
  # abandoned, or the plugin shutting down — the field is put back exactly as it
  # was from a snapshot taken before the first block changed.
  building:
    enabled: true
    # Log every refusal to place a building at INFO, with the job, the coordinates and the
    # reason. On by default because the alternative — which is what 0.26.0 shipped — is a
    # delivery that quietly arrives at an empty field with nothing anywhere to explain why.
    # Set false once the numbers below are tuned; refusals then drop to FINE.
    debug: true
    # How close the player must get before the site is built. NOT the ~100 blocks
    # that reads naturally: a server view-distance of 10 chunks is 160 blocks, so a
    # house placed at 100 would materialise in front of the player. At 220 it is
    # comfortably outside any normal view distance and streams in with the terrain.
    # A job accepted closer than this places immediately, before the player looks.
    place_at_blocks: 220
    # Reject rather than flatten: if the ground under the footprint varies by more
    # than this many blocks, the waypoint is rerolled. Terraforming somebody's
    # hillside cannot be undone by putting blocks back; picking a new field can.
    max_slope: 3
    # Trees are cleared, not refused. Ground level is found by looking DOWN through leaves,
    # trunks and undergrowth to real terrain, so a wood is a buildable field and only genuine
    # relief rejects it. How far down to look before giving up:
    ground_scan_depth: 32
    # How much of the footprint may be water before the spot is refused. A shoreline is a fine
    # place for a delivery; a lake is not.
    max_liquid_percent: 10
    # Radius of the flatness test, in blocks — roughly half the largest house. This runs while
    # the waypoint is being chosen, so broken ground costs a reroll rather than a walk.
    terrain_check_radius: 6
    # Margin around the building included in the snapshot, in blocks. The captured
    # region is deliberately larger than the house — Bukkit does not specify which
    # corner a structure rotation pivots around, so the box is sized to contain it
    # whichever way it turns. A box of air costs almost nothing once compressed.
    region_padding: 4
    # Filled beneath the house so it never floats on a slope. Must be < region_padding
    # or the fill would fall outside the snapshot and survive the restore.
    foundation_depth: 3
    # When the building comes down. NOT a timer: a clock can always run out while the
    # player is standing in the doorway, which is exactly what it did — the field
    # snapped back in the same breath as the payout. The rules, in order:
    #   1. NEVER while a player is inside the footprint. Restoring logs into the space
    #      someone occupies suffocates them. This one defers even past the backstop.
    #   2. Not before `linger_seconds`, so it does not vanish as you are being paid.
    #   3. Then once nobody is within `restore_distance` — it is out of sight, so it
    #      simply is not there next time you look — or once `max_linger_seconds` has
    #      passed, which covers somebody logging off on the doorstep.
    linger_seconds: 8
    restore_distance: 120
    max_linger_seconds: 600
    # Trees rooted where the house goes are cleared as WHOLE trees — a flood fill through
    # connected logs and leaves — and the captured region grows to bound them. Cutting at
    # a fixed height left canopy hanging in the sky, and orphaned leaves DECAY, which is a
    # change no restore undoes. The caps stop one delivery in a dark forest asking to
    # snapshot half a chunk; when they bite, whatever falls outside the region is left
    # standing rather than cleared.
    # Refuse a spot where somebody has already built — planks, a crafting table, a
    # bed, a pane of glass. None of those fall out of terrain generation on their
    # own, so finding one means the field is already someone's.
    #
    # This is the only check that catches an UNCLAIMED build. The waypoint refuses
    # claimed land, but Towny only knows about claims, and the thing a player is
    # most likely to have out in the wild is the base they never got round to
    # claiming. To every other check, that base is empty ground.
    #
    # It also rejects near villages, shipwrecks, mineshafts and ruins, which use
    # the same materials. That is deliberate: dropping a delivery house into the
    # middle of a village is its own kind of wrong, and a reroll costs nothing.
    reject_built_blocks: true
    clear_trees: true
    max_clear_blocks: 3000
    max_region_side: 64
    recipient_name: "Courier Recipient"
    # A site refuses to be built over anything a block snapshot could not put back.
    # Three kinds, all checked before the first block moves:
    #   * blocks with contents  — a chest is not recoverable from its block data
    #   * entities somebody placed — item frames, armour stands, chest minecarts,
    #     boats, displays. These are not in the snapshot at all, so anything that
    #     destroys one during the job destroys it for good. Wandering mobs are
    #     ignored; refusing a field because a cow walked through it would refuse
    #     most fields.
    #   * anything HomeCraft already tracks here — a placed PC, Workbench, Pallet
    #     or, worst of all, a placed Mini, which is a numbered and capped
    #     collectible that cannot be re-minted if the window goes wrong.
    # Below is the fourth kind: block types only the world knows about. A player
    # head out in a field is either somebody's decoration or a death-storage grave
    # (GravesX and similar), and neither should spend an hour behind a wall.
    # Chest-based and armour-stand-based graves are already caught by the two
    # checks above. Leave empty to get this default back.
    avoid_blocks: [ PLAYER_HEAD, PLAYER_WALL_HEAD ]
    # How far around a candidate waypoint to look for the two CHEAP refusals (the
    # tracked-placement query and the entity sweep) while a job is still being
    # rolled. Catching it here rerolls onto a different field; catching it later
    # leaves a job the player still has to walk that arrives at nothing. The full
    # block scan is thousands of reads, so it runs once at placement, not per
    # candidate.
    waypoint_scan_radius: 14
  # The buildings that may be placed. LEAVE THIS EMPTY to use the shipped table of
  # vanilla village houses — Mojang already maintains a correct-looking small house
  # per biome and it costs nothing to ship. Every key is resolved once at startup and
  # any that no longer exists is dropped with a warning naming it, because Mojang
  # renames these between versions.
  #
  # A non-empty list REPLACES the shipped table rather than adding to it, so a server
  # with commissioned builds gets only those.
  #   key        a structure key, e.g. village/plains/houses/plains_small_house_2
  #   file       an .nbt in plugins/HomeCraftManagement/buildings/ (use instead of key)
  #   weight     relative pick chance within a biome group (default 1)
  #   biomes     PLAINS | DESERT | SAVANNA | TAIGA | SNOWY — omit for "any"
  # There is no footprint setting: the structure is loaded before it is placed and
  # reports its own size, so a hand-written one could only ever be wrong.
  # Example, once a build has been commissioned:
  #   buildings:
  #     - { file: cottage.nbt, weight: 3, biomes: [PLAINS, TAIGA] }
  buildings: []

# ---------------------------------------------------------------------
#  Phase 2.5 — Finite, conserved commodities market (the storefront side
#  ONLY; QuickShop player-shops set their own prices and are untouched).
#
#  The market holds a REAL, finite stock per commodity. Selling ADDS to
#  stock; buying SUBTRACTS. Stock never goes negative. Price is a function
#  of stock: empty (0) = ceiling price AND out of stock; full = floor price.
# ---------------------------------------------------------------------
market:
  # Price curve shape. price = floor + (ceiling-floor) * (1 - stock/full_stock)^elasticity
  #   1.0 = linear from ceiling (empty) down to floor (full).
  #   > 1 = stays cheap once decently stocked, spikes only near empty.
  #   < 1 = stays pricey until nearly full. Range > 0.
  elasticity: 1.0
  # Glide smoothing: each trade the price moves (1 - inertia) of the way to
  # the stock-implied target, so it eases in instead of snapping. Range [0, 1).
  inertia: 0.2
  # Bid/ask spread: the market SELLS to you slightly above, and BUYS from you
  # slightly below, the mid price — kills round-trip arbitrage. 0.10 = ±5%.
  spread: 0.10
  # Stock level at which price reaches the floor, for items that don't set
  # their own full_stock.
  default_full_stock: 1024

  # Daily per-player SELL limit (anti-whale): caps how much a player can sell
  # to the market per UTC day. Resets daily; tracked in SQLite. Per-item
  # `max_daily_sell` overrides in the catalog stack ON TOP of this (tighter wins).
  sell_limits:
    enabled: true
    max_money_per_day: 5000     # 0 = unlimited money/day
    max_units_per_day: 0        # 0 = unlimited units/day (counted per item)
    bypass_permission: "hcm.market.limit.bypass"
    # Optional higher ceilings per LuckPerms-managed permission node. The most
    # generous node the player holds wins. Grant these via LuckPerms.
    ranks:
      - permission: "hcm.market.limit.vip"
        max_money_per_day: 12500
        max_units_per_day: 0

  # Daily per-player BUY limit (anti-drain / anti-hoard): the sell-side mirror —
  # caps how much a player can buy from the market per UTC day so no one drains a
  # commodity's supply the moment it's stocked. Same shape and semantics as
  # sell_limits; the shared bypass permission skips both. Per-item `max_daily_buy`
  # overrides in the catalog stack ON TOP of this (tighter wins). Tracked separately
  # in SQLite; resets at UTC midnight. Also applies to Crate store orders.
  buy_limits:
    enabled: true
    max_money_per_day: 5000     # 0 = unlimited money/day
    max_units_per_day: 0        # 0 = unlimited units/day (counted per item)
    bypass_permission: "hcm.market.limit.bypass"
    ranks:
      - permission: "hcm.market.limit.vip"
        max_money_per_day: 12500
        max_units_per_day: 0

  # Periodic price/stock snapshots (feed the Phase 5 web dashboard charts).
  price_history:
    interval_minutes: 30
    # Snapshots older than this many days are deleted (a batch at a time, on each
    # snapshot). The website's 30-day chart needs 30. 0 = keep everything.
    keep_days: 30

  # Admin-defined catalog. Each item:
  #   id            unique key used in commands (lower-case)
  #   material      a Bukkit Material (what is bought/sold)
  #   display_name  optional pretty name (&-colour codes)
  #   floor         lowest price (reached when stock is at/above full_stock)
  #   ceiling       highest price (reached at zero stock; also = out of stock)
  #   initial_stock starting units the market holds (sets the starting price)
  #                 MUST be strictly LESS than full_stock — see the hard rule below
  #   full_stock    units at which price hits the floor (default: default_full_stock)
  #   max_daily_sell optional per-player, per-item, per-day SELL cap (0/omitted = none)
  #   max_daily_buy  optional per-player, per-item, per-day BUY cap  (0/omitted = none)
  # Per-item caps stack ON TOP of the global sell_limits/buy_limits (tighter wins) and
  # are skipped by the bypass permission. Rule of thumb: max_daily_sell ~= 2% of
  # full_stock, max_daily_buy ~= 4% of full_stock, so no single player can move a
  # price more than a few percent per day. Set tight caps on rare items, high (or
  # none) on commons.
  # Staples seed with generous stock (cheap & available from day one); ores can
  # start at 0 → pinned at ceiling and UNBUYABLE until players sell some in.
  #
  # HARD RULE — stock must never reach full_stock. full_stock is the DENOMINATOR of
  # the price curve, not a target to hit: the market has to keep room for players to
  # sell into, or an item lands on the floor with nowhere left to go. So:
  #   * initial_stock >= full_stock is clamped to full_stock * 0.85 with a warning.
  #   * /hcm market setstock refuses to seat stock at/above full_stock (caps at -1).
  #   * A player CAN still sell stock up to full_stock — the item then sits at floor
  #     price and further sells earn almost nothing. That's the market's own signal
  #     saying "we're saturated, go sell something else."
  #
  # Edit + /hcm reload: existing stock/price is preserved on purpose, so changing
  # initial_stock/full_stock alone will NOT move an item that already exists; new items
  # seed fresh. To apply a NEW economy design to items already in the database, run
  # `/hcm market resetstock all` (or `<item>`) — that reseeds stock from config AND
  # snaps every price back onto the curve instead of letting inertia glide there.
  catalog:
    - id: cobblestone
      material: COBBLESTONE
      display_name: "&7Cobblestone"
      floor: 0.10
      ceiling: 5.0
      initial_stock: 17000    # MUST stay < full_stock (85% here) — see the rule above
      full_stock: 20000
      max_daily_sell: 400     # common — high volume allowed (~2% of full_stock)
      max_daily_buy: 800      # ~4% of full_stock
    - id: oak_log
      material: OAK_LOG
      display_name: "&6Oak Log"
      floor: 1.0
      ceiling: 20.0
      initial_stock: 4000
      full_stock: 8000
      max_daily_sell: 160     # ~2% of full_stock
      max_daily_buy: 320      # ~4%
    - id: wheat
      material: WHEAT
      display_name: "&eWheat"
      floor: 1.0
      ceiling: 12.0
      initial_stock: 3000
      full_stock: 6000
      max_daily_sell: 120
      max_daily_buy: 240
    - id: iron_ingot
      material: IRON_INGOT
      display_name: "&fIron Ingot"
      floor: 4.0
      ceiling: 40.0
      initial_stock: 512
      full_stock: 2048
      max_daily_sell: 40
      max_daily_buy: 80
    - id: gold_ingot
      material: GOLD_INGOT
      display_name: "&6Gold Ingot"
      floor: 20.0
      ceiling: 150.0
      initial_stock: 0          # starts empty -> ceiling price, out of stock
      full_stock: 1024
      max_daily_sell: 20
      max_daily_buy: 40
    - id: diamond
      material: DIAMOND
      display_name: "&bDiamond"
      floor: 60.0
      ceiling: 400.0
      initial_stock: 0          # starts empty -> ceiling price, out of stock
      full_stock: 512
      max_daily_sell: 10        # rare — tight cap protects supply (~2% of full_stock)
      max_daily_buy: 20         # ~4% of full_stock — prevents hoarding

# Phase 3 / 6 — Crate Ordering + Shipping
# Tiers are FULLY config-driven: add / rename / re-time any number of them and
# the checkout GUI renders them automatically (fastest → slowest). Each tier's
# real-time delivery delay is `real_hours` + `real_minutes` combined — use
# `real_minutes` alone for a sub-hour tier (Express delivers ~5 real minutes
# after ordering). Both accept decimals. An optional `label:` overrides the
# auto-generated display name.
shipping:
  # In PERCENTAGE mode every tier charges `percent` of the item total (faster =
  # higher %). `flat`/`prime_flat` apply ONLY in FLAT mode. A slower tier is also
  # clamped to never cost more than a faster one.
  mode: PERCENTAGE     # PERCENTAGE | FLAT
  tiers:
    express:   { real_minutes: 5, percent: 20 }   # fastest / most expensive
    one_day:   { real_hours: 1,   percent: 10 }
    two_day:   { real_hours: 3,   percent: 5  }
    three_day: { real_hours: 8,   percent: 0  }   # free
  locker: { enabled: true }

# ---------------------------------------------------------------------
#  Phase 4 — Minis (collectible heads & armor stands)
#  You assign each Mini a rarity + (optionally) a cap/price; the colour,
#  glint, and smart defaults follow from the rarity palette below. Edit the
#  palette once instead of styling every Mini. Everything reloads with
#  /hcm reload. The catalog is hand-picked — add only what you want.
# ---------------------------------------------------------------------
minis:
  pricing_mode: ESCALATING   # FIXED | ESCALATING (informational; per-entry price wins)

  # Assign the tier; colour + glint + default cap/price come from here.
  rarity_styles:
    LEGENDARY: { pane: YELLOW,     name_color: gold,         glint: true,  default_cap: 5,   default_price: 50000 }
    EPIC:      { pane: PURPLE,     name_color: light_purple, glint: true,  default_cap: 20,  default_price: 15000 }
    RARE:      { pane: BLUE,       name_color: aqua,         glint: false, default_cap: 100, default_price: 4000 }
    UNCOMMON:  { pane: GREEN,      name_color: green,        glint: false, default_cap: 500, default_price: 800 }
    # WHITE, not LIGHT_GRAY: a light-grey pane is the colour of the slot behind it and reads
    # as an empty tile. Same reason the Store's department tabs are items rather than panes.
    COMMON:    { pane: WHITE,      name_color: gray,         glint: false, default_cap: -1,  default_price: 150 }

  # Your "Type" list (the subject) — open/editable, used for browsing/filtering.
  categories: [ ANIMAL, FOOD, LETTER, SYMBOL, CHARACTER, VEHICLE, HOLIDAY, MISC ]

  # The catalog. Each entry inherits its series' rarity unless it sets its own;
  # cap/price default from the rarity palette. `texture` is a Base64 head value
  # (from minecraft-heads.com's "Value" field) — leave blank for a plain head.
  # `id` is optional (auto-derived from the name if omitted). `tags: [mining, fish]`
  # puts the Mini into those wild-drop tag pools (see loot: below) — an untagged Mini
  # never drops from a tag pool. Optional per-entry `card:` sets card cap / grade odds
  # (standard / graded / mint) / filament; otherwise they derive from the rarity.
  series:
    - name: "Starter Critters"
      rarity: COMMON
      entries:
        - { name: "Piggy Mini",  category: ANIMAL, tags: [starter, mining, zombie], texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvYTlhOTIxMmQzNmMwY2E3ZjA1MzczNzZmYWI1Yjg0ZWNiN2FmNjZjZjY3NTRlN2I4N2Q4YjFhMDhkOWQ1NDAyYiJ9fX0=" }
        - { name: "Chick Mini",  category: ANIMAL, tags: [starter, mining, fish], texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNzAzMWE5ODI2NTUyOGMwNDAxMjEzNTJkNWRhYTc4ODFhMjI1YjIyNGQ3ZDVlYmRmNjUyNzliYTgzODQ2OTZmYSJ9fX0=" }
    - name: "Legendary Relics"
      rarity: LEGENDARY
      entries:
        - { name: "Golden Idol", category: SYMBOL, tags: [mining], texture: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMWU1YmY2MDM2Mzg2YjJlYjAwZmMyZTYzNWU1NzViNzRlMmI1YTBjNjljYmI1MzY5MWFlZGZkYjZhMGMzNjAwOSJ9fX0=", cap: 5 }

  # ---- Grades (Phase 12). Rarity owns a Mini's colour + glint; the GRADE owns the
  # stars: a star suffix on the name ("Chick Mini ★★") and a lore line, never a
  # competing colour. Three grades, rolled at the Printer (and by wild drops / crates)
  # from the Mini's card odds. Names, symbols and value multipliers are yours to edit.
  # Old copies printed under the retired five-grade ladder migrate on sight:
  # Gray/Green → STANDARD, Blue/Purple → GRADED, Gold → MINT.
  grades:
    STANDARD: { name: "Standard", symbol: "☆",   multiplier: 1.0 }
    GRADED:   { name: "Graded",   symbol: "★★",  multiplier: 2.5 }
    MINT:     { name: "Mint",     symbol: "★★★", multiplier: 6.0 }

  # ---- World effects (Phase 12) for PLACED Minis — Display Case trophies, posed
  # armor-stand Minis, and wild-hunt spawns (which also get minis.loot.natural.effects) — by rarity. One repeating task serves
  # every placed Mini, skipping any with no player within `radius` blocks and any in
  # an unloaded chunk. Everything is torn down on removal / chunk unload / disable and
  # rebuilt from the datastore on load, so nothing leaks after a crash.
  #   particle:  type (a Particle name or none), count, interval_ticks, offset
  #   hologram:  a floating name (TextDisplay) in `color` (a named colour or #hex)
  #   light:     a hidden LIGHT block in the nearest air neighbour at `level`
  #   rotate:    a slowly turning ItemDisplay above a case (`degrees_per_second`);
  #              armor-stand Minis turn in place instead
  #   full_bright: the ItemDisplay ignores world light (Legendary)
  #   place_sound / place_particle: played once when the Mini is placed
  # Grade MINT copies play `mint_sound` on print and on place; Shiny copies add a ring
  # of `shiny_particle` on top of their rarity effect.
  # A WILD spawn's label is the exception to `radius`: it has its own, much tighter
  # `wild_hologram_range`, and unlike every other effect it is REMOVED again when you walk
  # away. A TextDisplay is legible from hundreds of blocks, so a label that stayed lit after
  # one pass stopped saying "this head is the prize" and started saying "the prize is over
  # here" — which is the one thing a timed hunt cannot have. Set it to 0 for no label at all.
  effects:
    radius: 16              # only Minis with a player this close get effects
    tick_interval: 10       # task cadence in ticks (particles use their own interval)
    mint_sound: BLOCK_AMETHYST_BLOCK_CHIME
    shiny_particle: GLOW
    wild_hologram_text: "&dA wild Mini!"
    wild_hologram_range: 8  # how close you must be to read it; 0 = never show it
    case_item_scale: 0.6    # size of the Mini floating above a Display Case
    case_item_height: 0.9   # how high above the case block it floats
    COMMON: {}
    UNCOMMON: {}
    RARE:
      particle: { type: END_ROD, count: 2, interval_ticks: 40, offset: 0.3 }
      hologram: { enabled: true, color: aqua }
      light:    { enabled: true, level: 7 }
      rotate:   { enabled: true, degrees_per_second: 20 }
      full_bright: false
    EPIC:
      particle: { type: ENCHANT, count: 6, interval_ticks: 20, offset: 0.4 }
      hologram: { enabled: true, color: light_purple }
      light:    { enabled: true, level: 7 }
      rotate:   { enabled: true, degrees_per_second: 20 }
      full_bright: false
    LEGENDARY:
      particle: { type: SOUL_FIRE_FLAME, count: 3, interval_ticks: 30, offset: 0.4 }
      hologram: { enabled: true, color: gold }
      light:    { enabled: true, level: 12 }
      rotate:   { enabled: true, degrees_per_second: 20 }
      full_bright: true
      place_sound: ITEM_TOTEM_USE
      place_particle: TOTEM_OF_UNDYING

  # ---- Announcements (Phase 12). One server-wide line when a Mini is FOUND (a wild
  # drop, or caught in the wild hunt — never the Printer or a pack); the [name] is a
  # hover card showing the item's full tooltip and click-runs /hcm museum <id>. The
  # wild hunt's HINTS (spawn_hint gates them; their text lives under
  # minis.loot.natural.hints) and a "The Rare Mini got away!" line when a hunt ends
  # without a catch (slipped_away). Every broadcast plays `sound` to everyone.
  # `min_rarity` and `per_rarity` silence chat for tiers you don't want announced.
  announce:
    enabled: true
    found: true
    spawn_hint: true
    slipped_away: true
    min_rarity: COMMON      # COMMON | UNCOMMON | RARE | EPIC | LEGENDARY
    sound: ENTITY_EXPERIENCE_ORB_PICKUP
    per_rarity: { COMMON: true, UNCOMMON: true, RARE: true, EPIC: true, LEGENDARY: true }

  # ---- Trading blocks (Phase 4c) — appearance of the placeable custom blocks.
  # Obtain with /hcm give <vending|display|auction>. The Display Case should stay
  # a PLAYER_HEAD so it can render the loaded Mini as a trophy.
  blocks:
    vending_machine: { material: BARREL,     name: "&dMini Vending Machine" }
    display_case:    { material: PLAYER_HEAD, name: "&b{variant} Display Case" }   # {variant} = Plain / Royal
    auction_house:   { material: LECTERN,    name: "&6Mini Auction House" }

  # ---- Auction House tuning (Phase 4c).
  auction:
    min_increment: 1.0          # smallest raise over the current bid
    anti_snipe_seconds: 15      # a bid within this window of the end extends the timer
    max_duration_minutes: 10080 # 7 days

  # ---- Wild Drops and the wild hunt (Phase 4c / 12). A source ties a trigger (BLOCK_BREAK | MOB_KILL |
  # FISHING | NATURAL_SPAWN) + a match (material / entity, or * for any) to a POOL with
  # a percentage chance — `chance_percent: 0.02` means 0.02% (about one per 5,000
  # rolls). The pool is either `list: <id>` (a weighted bag of Mini ids, below) or
  # `tag: <name>` (every catalog Mini carrying that tag, weighted by rarity via
  # rarity_weights; untagged Minis never drop). A drop MINTS a finished Mini — grade
  # rolled from the Mini's Printer odds (or the source's `grades:` override) and a
  # Shiny roll at shiny_percent (or the source's `shiny_percent`) — so it respects the
  # cap, counts toward circulation, and is announced. Block-break sources must name a
  # material (anti-farm). NATURAL_SPAWN sources are the WILD HUNT: they roll every
  # natural.interval_ticks for each online player and, on a hit, put a wild Mini's head
  # on the ground min_distance–max_distance blocks away for everyone to hunt. It is NOT
  # minted until somebody catches it — one that gets away burns no mint number. Empty by
  # default — nothing drops until you configure it.
  loot:
    # Tag-pool odds by rarity (relative weights).
    rarity_weights: { LEGENDARY: 1, EPIC: 4, RARE: 15, UNCOMMON: 40, COMMON: 100 }
    # Chance (%) that a found Mini is Shiny; sources may override with shiny_percent.
    shiny_percent: 5
    # The wild hunt: cadence, the find window, and how far from a player a Mini lands.
    # `chance_percent` on a NATURAL_SPAWN source is rolled once PER PLAYER PER TICK, so it
    # is not a rate on its own — with several people online the Minis-per-hour climbs with
    # the player count. The two throttles below say the thing you actually mean and hold
    # whatever the chance is: player_cooldown_minutes is how often ONE player can be
    # targeted, max_live is how many uncaught Minis may stand in the world at once (1 =
    # one hunt at a time, so everybody chases the same Mini).
    # A spot is real ground (never a treetop or a lake bed), never within 16 blocks of any
    # player, and only in a LOADED chunk — so keep max_distance inside your view-distance
    # (10 chunks = 160 blocks by default) or no Mini ever finds anywhere to stand.
    natural:
      interval_ticks: 24000          # 20 minutes
      despawn_minutes: 5             # the find window, announced in the first hint
      min_distance: 48
      max_distance: 96
      player_cooldown_minutes: 90    # 0 disables; forgotten on restart
      max_live: 1                    # 0 = no ceiling
      # How a wild Mini shows itself, for EVERY rarity, on top of its rarity's own effects
      # (minis.effects): a sparkle seen from `radius` blocks and a light. Its own radius
      # because minis.effects.radius (16) is set for a trophy on a shelf, not a hunt.
      effects: { radius: 32, particle: END_ROD, count: 3, interval_ticks: 20, light: 10 }
      # The light column the LAST hint turns on: rarity-coloured dust `height` blocks tall,
      # drawn every `interval_ticks` and sent to players far outside normal particle range.
      beam: { height: 24, interval_ticks: 10 }
      # Escalating hints, sent to everyone as the hunt's time runs down (at_percent of the
      # find window). Placeholders: {rarity} {player} (who it appeared near) {minutes}
      # {biome} {direction} (8-way, from where {player} was standing). Never coordinates or
      # distances. enabled: false keeps a stage silent; the last stage still lights the beam.
      # Players who log in mid-hunt get the hints so far.
      hints:
        - { at_percent: 0,  enabled: true, text: "A {rarity} Mini appeared near {player}! You have {minutes} minutes to find it." }
        - { at_percent: 30, enabled: true, text: "Hint: the {rarity} Mini is in a {biome} biome." }
        - { at_percent: 60, enabled: true, text: "Hint: it's to the {direction} of where {player} was." }
        - { at_percent: 85, enabled: true, text: "Look for the light beam!" }
    lists: []
    #  - id: common_blocks
    #    entries:
    #      - { mini: piggy_mini, weight: 10 }
    sources: []
    # Example sources (uncomment to enable — the shipped Minis carry these tags):
    #  - { trigger: BLOCK_BREAK,   match: STONE,  tag: mining, chance_percent: 0.02 }   # ~1 per 5,000 stone
    #  - { trigger: MOB_KILL,      match: ZOMBIE, tag: zombie, chance_percent: 1 }
    #  - { trigger: FISHING,       match: "*",    tag: fish,   chance_percent: 0.5 }
    #  - { trigger: NATURAL_SPAWN, match: "*",    tag: mining, chance_percent: 3 }      # 3% per 20-minute tick, PER PLAYER
    # Per-source overrides: grades: { standard: 60, graded: 30, mint: 10 } and shiny_percent: 10

  # ---- Posed armor-stand Minis (Phase 4d). Authored in-game: pose a real armor
  # stand, then `/hcm mini capturestand <miniId>` while looking at it. Poses are in
  # degrees; equipment is stored as Base64 items. Empty by default.
  stands: []
  #  - id: my_statue
  #    small: false
  #    arms: true
  #    base_plate: true
  #    invisible: false
  #    pose: { head: [0,0,0], body: [0,0,0], left_arm: [0,0,0], right_arm: [0,0,0], left_leg: [0,0,0], right_leg: [0,0,0] }
  #    equipment: { helmet: "", chest: "", legs: "", boots: "", main_hand: "", off_hand: "" }

# ---------------------------------------------------------------------
#  Phase 6 (Part B) — Block skins (custom head textures)
#  Every custom block can wear a proper minecraft-heads.com texture instead of
#  a default Steve head. Paste the head's Base64 `Value` string for a block and
#  `/hcm reload`; it's applied to the item on give/craft AND to the block when
#  placed (the placed head keeps the texture natively). A blank value is safe —
#  the block keeps its normal appearance (no crash, no ugly default swap).
#  When a value is set, the block is rendered as a PLAYER_HEAD wearing it.
#
#  Two-state / multi-part blocks:
#    pallet_empty / pallet_used  — a placed Pallet wears `pallet_empty` with no
#                                  listing and swaps to `pallet_used` the moment
#                                  one is loaded (back again when it's cleared).
#                                  The item in hand always uses pallet_empty.
#    vending_lower / vending_upper — the Vending Machine is TWO blocks tall: the
#                                  lower head is the real block; the upper head is
#                                  placed automatically above it (needs air).
#    mailbox.<variant>           — one texture per Mailbox colour variant
#                                  (wood, light_blue, black, white, purple, blue,
#                                  orange, yellow). /hcm give mailbox [variant].
# ---------------------------------------------------------------------
skins:
  # The delivery crate, one texture per distance band — a parcel for a local hop,
  # a crate for a long haul, so the item reads as the size of the trip. Blank is a
  # plain head, which is perfectly serviceable until you have textures for these.
  courier_package:
    local:     "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZjY4MjRjM2ZkMTZkNTljNDM5MzdiNTNmZTE0N2ViYWNiZjgxNzgyZjVmMjVkOTAzNTBlYWJhODYxNGU1ZDU3YiJ9fX0="
    regional:  "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvODcyZjUwZjlkMzYyMzMyMWE1NjQ5Y2E5NWU5ZTUzYTgyNDBjYzgxY2ZhZWI0MWEyODc2NjdkMWNjNWQ1MTM5NiJ9fX0="
    long_haul: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvNzhjMTA3ZTA3YTJiNGQ0OWRiNWY5YTk4MmExY2VmOTJiM2MyOWVkZjMyOTdmYjQ3MTQyYjU1NzZjZmQ4OTYwYiJ9fX0="
  pc:            "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMTQxZWFhNDA2NWUwYjVkMTVmOTA3OGEzZGMyZTZkMzQ0OWUxMjdkN2JjZjFhNmJiM2JmZGNlOGUzYjg4MjYzNiJ9fX0="   # computer / monitor head
  printer:       "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMzNhMjA4M2MwYTMwNjJiMzhiYjdjNWI1ZGJlYTk5NDgzNGRjYmEwZTQ1MDA5YTdmYzA1YTA4MzNjMjlhMzk3In19fQ=="   # 3D-printer head (Phase 9 Mini Printer)
  workbench:     ""   # crafting-table head (retired block; legacy placements only)
  vending_lower: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvZTE5MzQyZjZjYzk4NDFjNmIwYjU4ZGFmYTY0NzgxZTIwNjQxOGZiOGQyNTlmNmY0MjAwMDc1OTZhZDU5YzkwYiJ9fX0="   # vending-machine head (bottom half — the real block)
  vending_upper: "eyJ0ZXh0dXJlcyI6eyJTS0lOIjp7InVybCI6Imh0dHA6Ly90ZXh0dXJlcy5taW5lY3JhZnQubmV0L3RleHR1cmUvMjRhMzdlMGMxMjNmNGUxYTdlYjNjY2UxN2MxMjE0M2Y5M2MwYzdjZThjZTYyZDJmZjg2YTdjZTNhMDc5ZjQ3MyJ9fX0="   # vending-machine head (top half — auto-placed)
