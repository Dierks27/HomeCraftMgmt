# ---------------------------------------------------------------------
#  Recipes — every craftable HomeCraft block, data-driven and reloadable.
#  All SHAPED 3x3, registered as normal (vanilla) recipes under the plugin's
#  namespace, so they craft at any crafting table and show in the recipe book
#  (unlocked for every player on join — click-to-fill works). `/hcm reload`
#  re-registers them live. Symbols map to a Material, or to an item TAG with a
#  leading `#` (e.g. `#planks`, `#wooden_slabs`, `#wooden_fences` = any of them).
#  Space = empty cell. An empty `shape: []` disables that recipe.
#  The Mini Workbench is retired and deliberately has no recipe.
#  The PC recipe here is also what the Printer's craft grid matches.
# ---------------------------------------------------------------------
recipes:
  pc:
    shape: ["GGG", "CKC", "IQI"]
    ingredients: { G: GLASS_PANE, C: COPPER_BLOCK, K: COMPARATOR, I: IRON_BLOCK, Q: QUARTZ_BLOCK }
  printer:
    shape: ["IHI", "CSC", "PAP"]
    ingredients: { I: IRON_INGOT, H: HOPPER, C: COPPER_BLOCK, S: SMITHING_TABLE, P: PISTON, A: AMETHYST_BLOCK }
  vending:
    shape: ["IGI", "GEG", "IDI"]
    ingredients: { I: IRON_INGOT, G: GLASS, E: EMERALD_BLOCK, D: DISPENSER }
  pallet:
    shape: ["SSS", "TBT", "SSS"]
    ingredients: { S: "#wooden_slabs", T: STICK, B: BARREL }
  arcade:
    shape: ["GNG", "CJC", "RER"]
    ingredients: { G: TINTED_GLASS, N: NOTE_BLOCK, C: COPPER_BLOCK, J: JUKEBOX, R: REDSTONE_BLOCK, E: EMERALD_BLOCK }
  # Display Case pedestal styles: plain (polished deepslate) and royal (gold + red wool).
  display_case:
    plain:
      shape: ["GGG", "G G", "XYX"]
      ingredients: { G: GLASS_PANE, X: POLISHED_DEEPSLATE, Y: POLISHED_DEEPSLATE }
    royal:
      shape: ["GGG", "G G", "XYX"]
      ingredients: { G: GLASS_PANE, X: GOLD_INGOT, Y: RED_WOOL }
  # Filament: one recipe per dye colour (16, all in the recipe book). `<dye>` becomes
  # that colour's dye; `output` filament of the colour per craft. enabled: false turns
  # the whole set off.
  filament:
    enabled: true
    shape: ["SDS", "SLS"]
    ingredients: { S: STRING, D: "<dye>", L: SLIME_BALL }
    output: 3
  # One Mailbox recipe per colour variant: X = that colour's dye (wood = any planks).
  mailbox:
    wood:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: "#planks", I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    light_blue:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: LIGHT_BLUE_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    black:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: BLACK_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    white:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: WHITE_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    purple:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: PURPLE_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    blue:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: BLUE_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    orange:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: ORANGE_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }
    yellow:
      shape: ["XIX", "ICI", " F "]
      ingredients: { X: YELLOW_DYE, I: IRON_INGOT, C: CHEST, F: "#wooden_fences" }

# ---------------------------------------------------------------------
#  Phase 6 (Part C) — The Market Web Dashboard
#  A live, read-only web page for the Crate market, served by the plugin on its
#  own port (JDK built-in HTTP server — no extra deps). Tunnel the port with a
#  second Playit tunnel for outside access.
#  Read-only: it exposes market data and Minis counts only — never balances,
#  player names or internals.
#  Reloadable with /hcm reload (restarts the server, so a new feed token takes
#  effect straight away).
#
#  The same port serves the website's JSON feeds (the LilahCraft site fetches
#  them from its own server and caches them):
#    /api/market  every commodity: price, buy/sell, stock, 24h change and its
#                 price history (48 hours, 7 days and 30 days)
#    /api/minis   every Mini in the catalog: rarity, category, series, cap,
#                 how many were printed, sold out, and its head skin. Counts
#                 only — never who owns them.
#  Both are gzipped for clients that ask for it.
# ---------------------------------------------------------------------
web:
  dashboard:
    enabled: true
    bind: 0.0.0.0
    port: 8080
    refresh_seconds: 30
    title: "Crate Market"
    # Shared secret for the website feeds. Blank = open: anyone who can reach
    # the port can read /api/* (how it always worked). When set, /api/* needs
    # the header "Authorization: Bearer <token>" and answers 401 without it.
    # Put the same value in WordPress (Settings → LilahCraft → Feed token).
    # Quote it, and pick something long and random. It is never logged.
    feed_token: ""
    # With a token set, the dashboard page asks for it once (and the browser
    # remembers it). Set this true to let requests from this PC or the home
    # network (127.0.0.1, 10.x, 172.16-31.x, 192.168.x) skip the token instead.
    # A proxied request (X-Forwarded-For, Forwarded, X-Real-IP,
    # CF-Connecting-IP, ...) never counts as local.
    # Leave it false if the website reaches this port through a Playit agent on
    # this PC or any tunnel (ssh -R, WireGuard, frp, cloudflared...): their
    # connections arrive from 127.0.0.1 or a LAN address, so with this on the
    # internet would get in without the token.
    lan_skips_token: false

# ---------------------------------------------------------------------
#  Phase 7 — In-game economy displays (§3.8)
#  Sign boards, holograms (text-display entities), and map-TVs bound to a
#  commodity, re-rendered from the live market on this timer (never per-tick).
#  Bind them in-game (GUI-first): look at a sign / block / framed map, then run
#  the matching /hcm display … command and click the commodity from the picker.
# ---------------------------------------------------------------------
displays:
  refresh_seconds: 20
  # Holograms pair the floating price/trend text with a floating item, turning the
  # ticker into a little market kiosk.
  hologram:
    item_display: true     # show the floating item alongside the text
    position: above        # above | below the text
    spin: true             # slow-spin the floating item
    item: ""               # override Material (blank = the commodity's own item)
    item_scale: 0.3        # size of the floating item (1.0 = full block; ~0.3 reads well)
    text_scale: 1.0        # size of the price/trend text
  # TV price panels: a flat, wall-mounted TextDisplay "screen" bound to a commodity via
  # /hcm display tv <commodity> [scale]. Same content as a sign board (name / price /
  # trend / stock) but big, dark-backed and crisp — no floating items, no maps. It
  # live-updates on the refresh cadence above.
  tv:
    scale: 3.0             # panel size on the wall (the command's [scale] overrides per-panel)

# ---------------------------------------------------------------------
#  The Arcade (§3.9) — tokens buy fun.
#  Dollars buy things you keep; tokens buy fun; Minis come from the hunt.
#  Tokens are earned by PLAYING (login streak, playtime, quests, achievements, the wild
#  hunt) and spent on games (crates, the Scratch Ticket) and the Prize Counter. They
#  NEVER become dollars: no Arcade path takes or pays money, and everything bought or
#  won with tokens is tagged so no shop, pallet, vending machine, auction or courier run
#  will take it (§11 #9). All in-game currency — never real money. Reach it with
#  /hcm arcade or a placed Arcade Machine (/hcm give arcade).
# ---------------------------------------------------------------------
arcade:
  enabled: true
  # The placeable Arcade hub block (skin it via skins.arcade).
  block: { material: JUKEBOX, name: "&5Arcade Machine" }
  # Individual machine blocks (crate/scratch/pity/counter) are RETIRED: the Arcade
  # hub block is the only obtainable machine now. Any already-placed machines keep
  # working (these entries still style them) but they are no longer given/crafted.
  machines:
    crate:   { material: CHEST,             name: "&6Crate Machine" }
    scratch: { material: CARTOGRAPHY_TABLE, name: "&aScratch-Ticket Booth" }
    pity:    { material: ENCHANTING_TABLE,  name: "&bPity Exchange" }
    counter: { material: LECTERN,           name: "&eToken Counter" }
  # Arcade button icons. A blank texture uses the plain material; Bedrock players always see the
  # material (Geyser shows an unregistered custom head as a plain one). Paste a minecraft-heads
  # "Value" into texture to give a Java player a head instead. Keys: wallet, crate, scratch, wild,
  # wild_none, packs, quests, achievements, guide, and the Prize Counter tabs (boosts, hunt,
  # cosmetics, perks, trophies, minis).
  icons:
    wallet:       { texture: "", material: SUNFLOWER }
    crate:        { texture: "", material: CHEST }
    scratch:      { texture: "", material: FILLED_MAP }
    wild:         { texture: "", material: SPYGLASS }
    wild_none:    { texture: "", material: GRAY_DYE }
    packs:        { texture: "", material: PAPER }
    quests:       { texture: "", material: WRITABLE_BOOK }
    achievements: { texture: "", material: TOTEM_OF_UNDYING }
    guide:        { texture: "", material: KNOWLEDGE_BOOK }
    boosts:       { texture: "", material: SUGAR }
    hunt:         { texture: "", material: COMPASS }
    cosmetics:    { texture: "", material: FIREWORK_ROCKET }
    perks:        { texture: "", material: NAME_TAG }
    trophies:     { texture: "", material: GOLD_BLOCK }
    minis:        { texture: "", material: AMETHYST_SHARD }
  # The crate spin: about spin_ticks long (20 = 1 second), in `frames` steps that slow down as it
  # lands. Bedrock gets bedrock_frames steps — rapid inventory updates stutter through Geyser.
  reveal:
    spin_ticks: 60
    frames: 24
    bedrock_frames: 6
  tokens:
    login_streak:
      enabled: true
      # Escalating reward by consecutive-day streak (day1, day2, …); the last entry
      # repeats for longer streaks. One claim per local day (clock.time_zone), paid on
      # join or — for anyone online across midnight — within five minutes of it.
      # (reward_per_day is a fallback only when this list is empty.)
      rewards: [ 2, 2, 3, 3, 4, 4, 5 ]
      reward_per_day: 1
    playtime:
      enabled: true
      minutes_per_token: 60      # a token per hour played (0 = off)
  # Loot crates: a token cost + a weighted reward table. A reward is one of:
  #   card | mini   a Card (never a finished Mini): `mini: <id>`, `tag: <tag>` (rarity-
  #                 weighted), or `tag: "*"` (every Mini — the crate's jackpot). Sold-out
  #                 Cards drop out of the draw.
  #   pack          a sealed pack (`pack: <id>`)
  #   filament      `amount` filament, random colour unless `color:`
  #   tokens        `amount` tokens (must be LESS than the crate costs)
  #   prize         a Prize Counter row, free and ignoring its limit: `prize: <id>` or
  #                 `prize: [id, id]` (one at random; ones that can't be given are skipped)
  #   trail         a trail for `days` days: `trail: <id>` / [ids], or any trail if omitted
  # `money` and `item` rewards are rejected: tokens never become money. Odds are shown in
  # the crate screen; /hcm arcade odds prints each crate's value at counter prices.
  crates:
    arcade_crate:
      display: "&6Arcade Crate"
      cost_tokens: 15
      rewards:
        - { type: prize, prize: [speed_boost, mining_boost, night_vision, lucky_fishing], weight: 40 }
        - { type: prize, prize: firework_show, weight: 15 }
        - { type: prize, prize: mini_radar, weight: 12 }
        - { type: filament, amount: 8, weight: 10 }
        - { type: tokens, amount: 8, weight: 10 }
        - { type: trail, days: 1, weight: 8 }
        - { type: prize, prize: [hat_bunny, hat_panda, hat_fox, hat_penguin, hat_frog, hat_cake], weight: 3 }
        - { type: card, tag: "*", weight: 2 }
  # ---- The Prize Counter: KNOWN-OUTCOME token purchases, one screen per tab.
  # A crate is a pull; a prize is a price. Rows:
  #   id / tab (BOOSTS | HUNT | COSMETICS | PERKS | TROPHIES | MINIS) / display /
  #   description (lines) / cost_tokens / icon { texture, material } / type / enabled /
  #   limit { per: DAY | WEEK | LIFETIME, count }   (local days; optional)
  # Types and their extra keys:
  #   boost      effect (speed, haste, night_vision, water_breathing, luck …), amplifier
  #              (0 = level I), minutes. An item; right-click to use; stacks up to 3× its time.
  #   radar      the Mini Radar: right-click while a wild Mini is out — Cold/Warm/Hot/Burning!
  #   lure       the Mini Lure: the next wild Mini that rolls for ANYONE lands near you.
  #   firework   a harmless three-second firework show.
  #   trail      particle, days — a particle trail while you walk (/hcm trail toggles it).
  #   hat        texture — a head to wear. A hat with a blank texture is HIDDEN.
  #   command    commands (console; %player% %uuid%), requires_plugins, owned_if_permission
  #              (shows "Owned" and blocks rebuying), requires_prize. Hidden if a plugin is missing.
  #   trophy     texture (blank = the Arcade machine's head) — a numbered, placeable trophy.
  #   filament | block | pack    as before (filament: amount, color — omit to let them pick)
  #   pity       the Rare-or-better Card (price and weekly limit from arcade.pity)
  #   trade_in   opens Card trade-in (values in arcade.trade_in)
  #   quest_reroll  swap one of today's quests for another
  # Every physical prize is tagged hcm:token_prize: it can't be sold anywhere for money.
  # Anything costing 100+ asks "are you sure?" first.
  prizes:
    # -- Boosts
    - { id: speed_boost, tab: BOOSTS, display: "&bSpeed Boost", description: ["Run faster for 10 minutes."], cost_tokens: 8, icon: { texture: "", material: SUGAR }, type: boost, effect: speed, amplifier: 1, minutes: 10, limit: { per: DAY, count: 5 } }
    - { id: mining_boost, tab: BOOSTS, display: "&6Mining Boost", description: ["Mine faster for 10 minutes."], cost_tokens: 8, icon: { texture: "", material: GLOWSTONE_DUST }, type: boost, effect: haste, amplifier: 1, minutes: 10, limit: { per: DAY, count: 5 } }
    - { id: night_vision, tab: BOOSTS, display: "&9Night Vision", description: ["See in the dark for 20 minutes."], cost_tokens: 6, icon: { texture: "", material: PRISMARINE_CRYSTALS }, type: boost, effect: night_vision, amplifier: 0, minutes: 20, limit: { per: DAY, count: 5 } }
    - { id: water_breathing, tab: BOOSTS, display: "&3Water Breathing", description: ["Breathe underwater for 10 minutes."], cost_tokens: 6, icon: { texture: "", material: NAUTILUS_SHELL }, type: boost, effect: water_breathing, amplifier: 0, minutes: 10, limit: { per: DAY, count: 5 } }
    - { id: lucky_fishing, tab: BOOSTS, display: "&aLucky Fishing", description: ["Better fishing luck for 10 minutes."], cost_tokens: 8, icon: { texture: "", material: RABBIT_FOOT }, type: boost, effect: luck, amplifier: 1, minutes: 10, limit: { per: DAY, count: 5 } }
    - { id: quest_reroll, tab: BOOSTS, display: "&eQuest Reroll", description: ["Swap one of today's quests", "for a different one."], cost_tokens: 10, icon: { texture: "", material: WRITABLE_BOOK }, type: quest_reroll, limit: { per: DAY, count: 1 } }
    # -- Hunt gear
    - { id: mini_radar, tab: HUNT, display: "&bMini Radar", description: ["Tells you if you're getting", "close to a wild Mini."], cost_tokens: 25, icon: { texture: "", material: COMPASS }, type: radar }
    - { id: mini_lure, tab: HUNT, display: "&dMini Lure", description: ["The next wild Mini", "appears near you."], cost_tokens: 40, icon: { texture: "", material: HEART_OF_THE_SEA }, type: lure }
    # -- Cosmetics
    - { id: firework_show, tab: COSMETICS, display: "&cFirework Show", description: ["A big firework show", "all around you!"], cost_tokens: 15, icon: { texture: "", material: FIREWORK_ROCKET }, type: firework }
    - { id: trail_hearts, tab: COSMETICS, display: "&cHeart Trail", description: ["Hearts follow you", "for 7 days."], cost_tokens: 100, icon: { texture: "", material: RED_DYE }, type: trail, particle: HEART, days: 7 }
    - { id: trail_notes, tab: COSMETICS, display: "&aMusic Trail", description: ["Music notes follow you", "for 7 days."], cost_tokens: 100, icon: { texture: "", material: NOTE_BLOCK }, type: trail, particle: NOTE, days: 7 }
    - { id: trail_sparkles, tab: COSMETICS, display: "&eSparkle Trail", description: ["Sparkles follow you", "for 7 days."], cost_tokens: 100, icon: { texture: "", material: AMETHYST_SHARD }, type: trail, particle: FIREWORK, days: 7 }
    # Hats: paste a minecraft-heads.com "Value" into texture to show one (blank = hidden).
    - { id: hat_bunny, tab: COSMETICS, display: "&fBunny Hat", description: ["Wear it on your head!"], cost_tokens: 120, icon: { texture: "", material: LEATHER_HELMET }, type: hat, texture: "" }
    - { id: hat_panda, tab: COSMETICS, display: "&fPanda Hat", description: ["Wear it on your head!"], cost_tokens: 120, icon: { texture: "", material: LEATHER_HELMET }, type: hat, texture: "" }
    - { id: hat_fox, tab: COSMETICS, display: "&6Fox Hat", description: ["Wear it on your head!"], cost_tokens: 120, icon: { texture: "", material: LEATHER_HELMET }, type: hat, texture: "" }
    - { id: hat_penguin, tab: COSMETICS, display: "&fPenguin Hat", description: ["Wear it on your head!"], cost_tokens: 120, icon: { texture: "", material: LEATHER_HELMET }, type: hat, texture: "" }
    - { id: hat_frog, tab: COSMETICS, display: "&aFrog Hat", description: ["Wear it on your head!"], cost_tokens: 120, icon: { texture: "", material: LEATHER_HELMET }, type: hat, texture: "" }
    - { id: hat_cake, tab: COSMETICS, display: "&dCake Hat", description: ["Wear it on your head!"], cost_tokens: 120, icon: { texture: "", material: LEATHER_HELMET }, type: hat, texture: "" }
    # Name colours need your chat format to show %luckperms_meta_hcm_name_color% — off until it does.
    - { id: name_color_aqua, tab: COSMETICS, display: "&bAqua Name", description: ["Your name in aqua."], cost_tokens: 150, icon: { texture: "", material: LIGHT_BLUE_DYE }, type: command, enabled: false, commands: ["lp user %player% meta set hcm_name_color &b"], requires_plugins: [LuckPerms], limit: { per: LIFETIME, count: 1 } }
    - { id: name_color_gold, tab: COSMETICS, display: "&6Gold Name", description: ["Your name in gold."], cost_tokens: 150, icon: { texture: "", material: ORANGE_DYE }, type: command, enabled: false, commands: ["lp user %player% meta set hcm_name_color &6"], requires_plugins: [LuckPerms], limit: { per: LIFETIME, count: 1 } }
    - { id: name_color_pink, tab: COSMETICS, display: "&dPink Name", description: ["Your name in pink."], cost_tokens: 150, icon: { texture: "", material: PINK_DYE }, type: command, enabled: false, commands: ["lp user %player% meta set hcm_name_color &d"], requires_plugins: [LuckPerms], limit: { per: LIFETIME, count: 1 } }
    # -- Perks (EssentialsX + LuckPerms).
    # home_slot: +1 home on top of whatever the player already has (a mayor with 5 gets a 6th).
    #   Essentials gives a player their HIGHEST sethome-multiple tier, never the sum, so the perk
    #   works out the player's own limit, adds the slots bought, and grants one tier hcm_<total>
    #   through LuckPerms. Each total needs its tier under sethome-multiple in
    #   plugins/Essentials/config.yml — e.g. hcm_2: 2, hcm_3: 3 … up to your biggest base + 2.
    #   A missing tier refuses the purchase (nothing charged) and logs the exact line to add.
    #   costs: the price of the 1st, 2nd, … one. Hidden for unlimited players and bases of 20+.
    - { id: home_slot, tab: PERKS, display: "&a+1 Home", description: ["One more /home, on top of", "the homes you already have."], costs: [400, 600], icon: { texture: "", material: RED_BED }, type: home_slot, requires_plugins: [LuckPerms, Essentials], limit: { per: LIFETIME, count: 2 } }
    - { id: hat_command, tab: PERKS, display: "&e/hat", description: ["Wear the block in your hand", "on your head with /hat."], cost_tokens: 300, icon: { texture: "", material: CARVED_PUMPKIN }, type: command, commands: ["lp user %player% permission set essentials.hat true"], owned_if_permission: essentials.hat, requires_plugins: [LuckPerms, Essentials], limit: { per: LIFETIME, count: 1 } }
    # Chat titles need your chat format / TAB to show %luckperms_meta_hcm_title% — off until they do.
    - { id: title_explorer, tab: PERKS, display: "&aTitle: Explorer", description: ["Show [Explorer] in chat."], cost_tokens: 500, icon: { texture: "", material: MAP }, type: command, enabled: false, commands: ["lp user %player% meta set hcm_title Explorer"], requires_plugins: [LuckPerms], limit: { per: LIFETIME, count: 1 } }
    - { id: title_miner, tab: PERKS, display: "&7Title: Miner", description: ["Show [Miner] in chat."], cost_tokens: 500, icon: { texture: "", material: IRON_PICKAXE }, type: command, enabled: false, commands: ["lp user %player% meta set hcm_title Miner"], requires_plugins: [LuckPerms], limit: { per: LIFETIME, count: 1 } }
    - { id: title_collector, tab: PERKS, display: "&dTitle: Collector", description: ["Show [Collector] in chat."], cost_tokens: 500, icon: { texture: "", material: ITEM_FRAME }, type: command, enabled: false, commands: ["lp user %player% meta set hcm_title Collector"], requires_plugins: [LuckPerms], limit: { per: LIFETIME, count: 1 } }
    - { id: title_hunter, tab: PERKS, display: "&bTitle: Hunter", description: ["Show [Hunter] in chat."], cost_tokens: 500, icon: { texture: "", material: SPYGLASS }, type: command, enabled: false, commands: ["lp user %player% meta set hcm_title Hunter"], requires_plugins: [LuckPerms], limit: { per: LIFETIME, count: 1 } }
    - { id: title_farmer, tab: PERKS, display: "&6Title: Farmer", description: ["Show [Farmer] in chat."], cost_tokens: 500, icon: { texture: "", material: WHEAT }, type: command, enabled: false, commands: ["lp user %player% meta set hcm_title Farmer"], requires_plugins: [LuckPerms], limit: { per: LIFETIME, count: 1 } }
    # -- Trophies
    - { id: arcade_trophy, tab: TROPHIES, display: "&6Arcade Trophy", description: ["A numbered trophy", "with your name on it."], cost_tokens: 750, icon: { texture: "", material: GOLD_BLOCK }, type: trophy, texture: "" }
    # -- Minis
    - { id: pity, tab: MINIS, display: "&bRare Card", description: ["A Rare-or-better Card.", "One a week."], icon: { texture: "", material: NETHER_STAR }, type: pity }
    - { id: filament_bundle, tab: MINIS, display: "&fFilament Bundle", description: ["8 filament.", "You pick the colour."], cost_tokens: 3, icon: { texture: "", material: WHITE_DYE }, type: filament, amount: 8 }
    - { id: display_case, tab: MINIS, display: "&bDisplay Case", description: ["Show off a Mini!"], cost_tokens: 10, icon: { texture: "", material: GLASS }, type: block, block: display_case }
    - { id: trade_in, tab: MINIS, display: "&dTrade In Cards", description: ["Swap Cards you don't need", "for tokens."], icon: { texture: "", material: HOPPER }, type: trade_in }
  # The Rare-or-better Card: a guaranteed Card at or above `guarantees_rarity`, weighted by
  # rarity, cap-aware. `per_week` per player (local weeks).
  pity:
    tokens: 150
    guarantees_rarity: RARE      # COMMON | UNCOMMON | RARE | EPIC | LEGENDARY
    per_week: 1
  # Card trade-in: tokens per Card, by rarity. The only money→token path besides pack
  # token prices — one way, and small.
  trade_in: { COMMON: 3, UNCOMMON: 5, RARE: 12, EPIC: 25, LEGENDARY: 50 }
  # One-time achievements, in the order the Achievements screen shows them. Types:
  #   EVENT       a first-time moment (fired by the plugin where it happens)
  #   STAT        `stat:` a lifetime vanilla statistic, or CATCH_FISH | TRAVEL_ON_FOOT |
  #               KILL_HOSTILES | BREED_ANIMALS | TRADE_VILLAGER; `target`
  #   COUNTER     `counter:` wild_finds | rare_wild_finds | quests_done | deliveries |
  #               crates | jackpots | biomes; `target`
  #   COLLECTION  distinct Minis owned right now; `target`
  #   GRADE       print a Mini of `grade:` (MINT)
  #   FINISH      own a Mini with `finish:` (SHINY)
  #   STREAK      a login streak of `target` days
  #   BALANCE     have `target` dollars
  # Keep ids stable — unlocks are stored by id.
  achievements:
    - { id: first_pc, group: "Getting Started", type: EVENT, reward: 10, display: "Build your first PC" }
    - { id: first_sale, group: "Getting Started", type: EVENT, reward: 10, display: "Sell something to Crate" }
    - { id: first_crate, group: "Getting Started", type: EVENT, reward: 5, display: "Open an Arcade Crate" }
    - { id: first_pack, group: "Getting Started", type: EVENT, reward: 10, display: "Open a Card Pack" }
    - { id: first_print, group: "Getting Started", type: EVENT, reward: 15, display: "Print your first Mini" }
    - { id: first_mini, group: "Getting Started", type: EVENT, reward: 15, display: "Get your first Mini" }
    - { id: wild_1, group: "Mini Hunter", type: COUNTER, counter: wild_finds, target: 1, reward: 25, display: "Catch a wild Mini" }
    - { id: wild_5, group: "Mini Hunter", type: COUNTER, counter: wild_finds, target: 5, reward: 50, display: "Catch 5 wild Minis" }
    - { id: wild_rare, group: "Mini Hunter", type: COUNTER, counter: rare_wild_finds, target: 1, reward: 50, display: "Catch a Rare-or-better wild Mini" }
    - { id: collect_5, group: "Collector", type: COLLECTION, target: 5, reward: 20, display: "Own 5 different Minis" }
    - { id: collect_15, group: "Collector", type: COLLECTION, target: 15, reward: 50, display: "Own 15 different Minis" }
    - { id: shiny_1, group: "Collector", type: FINISH, finish: SHINY, reward: 40, display: "Own a Shiny Mini" }
    - { id: mint_grade, group: "Collector", type: GRADE, grade: MINT, reward: 40, display: "Print a Mint-grade Mini" }
    - { id: fish_100, group: "Adventure", type: STAT, stat: CATCH_FISH, target: 100, reward: 20, display: "Catch 100 fish" }
    - { id: walk_10k, group: "Adventure", type: STAT, stat: TRAVEL_ON_FOOT, target: 10000, reward: 20, display: "Walk 10,000 blocks" }
    - { id: hostiles_500, group: "Adventure", type: STAT, stat: KILL_HOSTILES, target: 500, reward: 30, display: "Defeat 500 hostile mobs" }
    - { id: breed_50, group: "Adventure", type: STAT, stat: BREED_ANIMALS, target: 50, reward: 20, display: "Breed 50 animals" }
    - { id: biomes_15, group: "Adventure", type: COUNTER, counter: biomes, target: 15, reward: 30, display: "Visit 15 different biomes" }
    - { id: streak_7, group: "Dedication", type: STREAK, target: 7, reward: 25, display: "7-day login streak" }
    - { id: streak_30, group: "Dedication", type: STREAK, target: 30, reward: 100, display: "30-day login streak" }
    - { id: quests_25, group: "Dedication", type: COUNTER, counter: quests_done, target: 25, reward: 30, display: "Finish 25 quests" }
    - { id: quests_100, group: "Dedication", type: COUNTER, counter: quests_done, target: 100, reward: 75, display: "Finish 100 quests" }
    - { id: deliveries_10, group: "Work", type: COUNTER, counter: deliveries, target: 10, reward: 25, display: "Finish 10 Courier deliveries" }
    - { id: balance_1k, group: "Money", type: BALANCE, target: 1000, reward: 10, display: "Have $1,000" }
    - { id: rich_10k, group: "Money", type: BALANCE, target: 10000, reward: 50, display: "Have $10,000" }
    - { id: jackpot, group: "Arcade", type: EVENT, reward: 25, display: "Win the Scratch Ticket jackpot" }
  # Daily/weekly quests. Each player DRAWS their own `daily_draw` / `weekly_draw` from the
  # pools the first time they're needed in a day/week (local time) — no two of one type.
  # A Quest Reroll (Prize Counter) swaps one unfinished daily. Each row:
  #   id, type, target, reward (tokens), display
  # Types: PUSHED by gameplay — PLANT_CROPS, HARVEST_CROPS (grown crops), COOK_FOOD,
  #   SMELT_ORE, MINE_BLOCKS (natural stone/deepslate/ore, not blocks you placed),
  #   VISIT_BIOMES (distinct biomes this period), COMPLETE_DELIVERY (Courier),
  #   FIND_WILD_MINI, SELL_MARKET (money), OPEN_CRATE, PRINT_MINI, OPEN_PACK, SCRATCH.
  #   PULLED from statistics (every 30s) — CATCH_FISH, KILL_HOSTILES, BREED_ANIMALS,
  #   TRADE_VILLAGER, TRAVEL_ON_FOOT (blocks; walking/sprinting/sneaking only).
  # Nothing counts in a world the economy is disabled in.
  quests:
    enabled: true
    # Which day a week rolls over on (local midnight).
    week_starts: MONDAY
    daily_draw: 3
    weekly_draw: 2
    daily_pool:
      - { id: fish_daily,     type: CATCH_FISH,        target: 8,    reward: 5, display: "Catch 8 fish" }
      - { id: walk_daily,     type: TRAVEL_ON_FOOT,    target: 1000, reward: 4, display: "Walk 1,000 blocks" }
      - { id: hostiles_daily, type: KILL_HOSTILES,     target: 20,   reward: 5, display: "Defeat 20 hostile mobs" }
      - { id: breed_daily,    type: BREED_ANIMALS,     target: 4,    reward: 4, display: "Breed 4 animals" }
      - { id: trade_daily,    type: TRADE_VILLAGER,    target: 3,    reward: 4, display: "Trade with villagers 3 times" }
      - { id: plant_daily,    type: PLANT_CROPS,       target: 32,   reward: 4, display: "Plant 32 crops" }
      - { id: harvest_daily,  type: HARVEST_CROPS,     target: 48,   reward: 4, display: "Harvest 48 grown crops" }
      - { id: cook_daily,     type: COOK_FOOD,         target: 16,   reward: 4, display: "Cook 16 food" }
      - { id: smelt_daily,    type: SMELT_ORE,         target: 24,   reward: 4, display: "Smelt 24 ore" }
      - { id: mine_daily,     type: MINE_BLOCKS,       target: 200,  reward: 5, display: "Mine 200 stone or ore" }
      - { id: biome_daily,    type: VISIT_BIOMES,      target: 3,    reward: 5, display: "Visit 3 different biomes" }
      - { id: delivery_daily, type: COMPLETE_DELIVERY, target: 1,    reward: 5, display: "Finish a Courier delivery" }
    weekly_pool:
      - { id: hostiles_weekly, type: KILL_HOSTILES,     target: 150,  reward: 25, display: "Defeat 150 hostile mobs" }
      - { id: fish_weekly,     type: CATCH_FISH,        target: 40,   reward: 20, display: "Catch 40 fish" }
      - { id: walk_weekly,     type: TRAVEL_ON_FOOT,    target: 6000, reward: 20, display: "Walk 6,000 blocks" }
      - { id: breed_weekly,    type: BREED_ANIMALS,     target: 15,   reward: 20, display: "Breed 15 animals" }
      - { id: trade_weekly,    type: TRADE_VILLAGER,    target: 15,   reward: 20, display: "Trade with villagers 15 times" }
      - { id: smelt_weekly,    type: SMELT_ORE,         target: 128,  reward: 20, display: "Smelt 128 ore" }
      - { id: biome_weekly,    type: VISIT_BIOMES,      target: 8,    reward: 25, display: "Visit 8 different biomes" }
      - { id: delivery_weekly, type: COMPLETE_DELIVERY, target: 5,    reward: 25, display: "Finish 5 Courier deliveries" }
      - { id: wild_weekly,     type: FIND_WILD_MINI,    target: 1,    reward: 30, display: "Catch a wild Mini" }
  # The Scratch Ticket: tokens in, tokens out, decided the moment you buy it. The pot
  # starts at `seed`, grows `per_ticket` with every ticket, tops out at `cap`, and goes
  # back to `seed` when someone wins it (with a shout to the whole server).
  # The shipped table returns ~78% over time — /hcm arcade odds prints it.
  lotto:
    ticket_tokens: 10
    payouts:
      - { tokens: 0,  weight: 25 }
      - { tokens: 3,  weight: 40 }     # near-miss: the most common result, not the dud
      - { tokens: 8,  weight: 22 }
      - { tokens: 20, weight: 9 }
      - { tokens: 50, weight: 3 }
      - { jackpot: true, weight: 1 }
    jackpot: { seed: 50, per_ticket: 1, cap: 1000 }
