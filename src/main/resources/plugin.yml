name: HomeCraftManagement
version: '${version}'
main: com.dierks.homecraft.HomeCraftManagement
description: HomeCraft Management — dynamic market, online ordering, and Mini collectibles.
authors: [Dierks27]
website: https://github.com/Dierks27/HomeCraftMgmt

# Paper 26.2 / 26.3 target. api-version selects the compatibility contract; '1.21' is a
# broadly-supported baseline. If the live 26.2 server logs that this value is
# unsupported/legacy, bump it to the newest token that server accepts.
api-version: '1.21'

# Recipe-sync bridges snapshot the recipe list when THEY enable; loading before
# them guarantees HomeCraft's recipes are registered by then (JEI visibility).
loadbefore:
  - JEIServerProxy

# All integrations are OPTIONAL. We load after them when present and degrade
# gracefully when absent (see integration.ProtectionService). We never hard-depend.
softdepend:
  - Vault
  - Towny
  - WorldGuard
  - WorldEdit
  - LuckPerms
  - PlaceholderAPI
  # Bedrock players (Geyser) get plain-material icons and short animations.
  - floodgate
  # Sound Mufflers reach sounds on their way to each player through ProtocolLib. Without it
  # mufflers still place and save their settings, but hush nothing.
  - ProtocolLib
  # The Games world: loading after Multiverse means the Games world exists when world games start,
  # and a player's saved things are captured after Multiverse-Inventories has swapped them.
  - Multiverse-Core
  - Multiverse-Inventories

commands:
  hcm:
    description: HomeCraft Management admin & utility commands.
    usage: |-
      /hcm admin             - open the Admin Studio (manage & import Minis)
      /hcm auction           - open the Mini Auction House
      /hcm reload            - reload config.yml and re-register recipes
      /hcm give <printer|pc|vending|display [plain|royal]|mailbox [variant]|pallet|arcade|muffler> [player]
      /hcm give <card <id>|pack <id>|binder|filament <color> <n>> [player]
      /hcm market list|price <item>|buy <item> <qty>|sell <item> <qty>
      /hcm market resetstock <item|all>  - admin: reseed stock+price from config
      /hcm market setstock <item> <amount>  - admin: set one item's stock
      /hcm market news [on|off]  - what's new at the Crate Market; news in your chat on or off
      /hcm market news <item> <up|down|wanted> [percent] [quiet]  - admin: force a news flash now
      /hcm market sim status|hot|deal|stop|reset|pause|resume|preview|audit|real  - admin: run and test the live market
      /hcm balance           - your money and Arcade tokens in one place
      /hcm backup now        - admin: write a database backup
      /hcm display sign|hologram|tv [commodity|@news]|remove  - bind an in-game economy display
      /hcm arcade            - open the Arcade hub
      /hcm arcade odds       - admin: Scratch Ticket RTP and each crate's value
      /hcm trail [name|off]  - turn your particle trail on or off
      /hcm achievements      - your achievements
      /hcm config reset <section> [confirm]  - admin: put arcade/games/packs/hunt/effects/clock back to defaults
      /hcm homes refresh [player]  - admin: recheck the +1 Home perk
      /hcm guide [page]      - How It Works (tokens, minis, wild, arcade)
      /hcm tokens            - show your Arcade token balance
      /hcm tokens give|set|take <player> <n>  - admin: adjust tokens
      /hcm tokens audit [days] [player]  - admin: tokens earned/spent by source
      /hcm tokens history <player> [n]  - admin: a player's last n token changes
      /hcm museum [id]       - browse the Mini Museum (browse-only; click a Mini for details)
      /hcm mini capturestand <miniId>  - capture a posed armor stand into a Mini
      /hcm mini repair-escaped [confirm]  - admin: give back mint numbers old wild escapes burned
      /hcm hunt spawn [rarity] [player]|status|clear  - admin: the wild hunt
      /hcm play              - the Games screen (games of chance, cabinets, courses, mini golf)
      /hcm play <game|course> [player]  - open a game or start a course (for another player: admin)
      /hcm play break        - Take a break: your own limits on games of chance
      /hcm play accept|deny  - answer a game invite
      /hcm leave             - leave the world game you are in (your things come back)
      /hcm games status|course|golf|feature|break|saved|scores  - admin: run the Games
    # NOTE: deliberately NOT gated on a single node — every subcommand checks its own
    # permission (hcm.admin, hcm.market.list, hcm.market.price, hcm.market.order, …), so
    # a player who may check a price can still do so without being handed the whole CLI.
    aliases: [homecraft]

permissions:
  hcm.admin:
    description: Full access to all HomeCraft Management admin functions.
    default: op
    children:
      hcm.use: true
      hcm.market.list: true
      hcm.market.price: true
      hcm.pc.use: true
      hcm.pc.craft: true
      hcm.workbench.place: true
      hcm.workbench.use: true
      hcm.printer.use: true
      hcm.muffler.use: true
      hcm.games.play: true
      hcm.games.chance: true
      hcm.games.admin: true
      hcm.market.order: true
      hcm.market.buy: true
      hcm.market.limit.bypass: true
      hcm.market.sim: true
      hcm.protection.bypass: true
  hcm.use:
    description: >-
      Parent node granting both market view commands (list AND single-item price).
      Kept for backwards compatibility — grant it to give an admin the full view.
    default: op
    children:
      hcm.market.list: true
      hcm.market.price: true
  hcm.market.list:
    description: >-
      Dump the FULL market catalog with every price and stock level via
      /hcm market list. Op-only: regular players browse the catalog in the PC GUI.
    default: op
  hcm.market.price:
    description: >-
      Check a single commodity's price and history (/hcm market price|history), read
      the Crate Market news and turn it on or off in your chat (/hcm market news
      [on|off]), and view your own balance (/hcm balance). Available to everyone — no
      PC needed.
    default: true
  hcm.market.order:
    description: >-
      Sell into the dynamic market (/hcm market sell). Selling needs no shipping —
      you are the one delivering the goods — so this stays open to everyone.
    default: true
  hcm.market.buy:
    description: >-
      Buy from the dynamic market by command (/hcm market buy), with NO shipping cost
      and NO wait. Op-only, and it has to stay that way: players order at the store,
      where a shipping tier is chosen and paid for. A command that skips both makes
      every tier — and the Locker, and in-transit orders — pointless.
    default: op
  hcm.market.limit.bypass:
    description: >-
      Exempt from the daily per-player buy AND sell limits (and per-item caps). The live
      market's event limits (HOT/UP sell limit, DEAL/DOWN buy limit) still apply.
    default: op
  hcm.market.sim:
    description: >-
      Run and test the live market: force a news flash (/hcm market news <item>
      <up|down|wanted>), start a HOT or DEAL, stop, reset, pause or resume it, preview
      and audit it, and test real-world prices (/hcm market sim ...). Op-only: forcing
      events moves prices for everyone.
    default: op
  hcm.pc.use:
    description: Open the store by right-clicking a placed PC.
    default: true
  hcm.pc.craft:
    description: Craft the PC at a Mini Workbench.
    default: true
  hcm.workbench.place:
    description: Place a Mini Workbench.
    default: true
  hcm.workbench.use:
    description: Open the crafting GUI of a placed Mini Workbench.
    default: true
  hcm.printer.use:
    description: Use a placed Mini Printer to print Minis from Cards.
    default: true
  hcm.muffler.use:
    description: >-
      Place a Sound Muffler and change what it hushes. Anyone can look at a muffler's
      settings; only its owner (or an admin) can change them.
    default: true
  hcm.protection.bypass:
    description: Bypass Towny/WorldGuard build checks for HomeCraft custom blocks.
    default: op
  hcm.games.play:
    description: >-
      Play the Games (/hcm play): the Games screen, the menu cabinets, time-trial courses and
      mini golf, and leave a world game (/hcm leave). The Games only open once games.enabled is
      true in config.
    default: true
  hcm.games.chance:
    description: >-
      Play the games of chance for tokens (Ore Slots, Twenty-One, the Wheel, Higher or Lower,
      Coin Flip). Revoke it for a group to keep them out of every game of chance, including
      Crates, Scratch Tickets and Card Packs bought with tokens; they then don't see those games
      at all. Skill games are not affected.
    default: true
  hcm.games.admin:
    description: >-
      Run the Games (/hcm games): status, time-trial and golf courses, the featured game, a
      player's Take a break limits (/hcm games break), saved things (/hcm games saved) and score
      boards; open a game for another player (/hcm play <game> <player>); write [Arcade] join
      signs; build in the Games world.
    default: op
  # The player-facing /hcm openers (DESIGN.md §10). Each opens a read-only or
  # token-only GUI and is the documented player route to that feature — /hcm auction
  # is the ONLY way to reach the Auction House, and /hcm museum is the click target of
  # every found-broadcast. They default to true: the nodes exist so an admin can
  # withdraw one without removing the feature. Nothing that moves money or market
  # stock is reachable through them; that is what §3.2's GUI-first rule protects.
  hcm.auction.list:
    description: Open the Mini Auction House (/hcm auction).
    default: true
  hcm.museum.use:
    description: Browse the Mini Museum (/hcm museum [id]).
    default: true
  hcm.arcade.use:
    description: Open the Arcade — crates, pity and scratch tickets (/hcm arcade).
    default: true
  hcm.quests.use:
    description: Open the daily/weekly Quests board (/hcm quests).
    default: true
  hcm.achievements.use:
    description: Open your Achievements (/hcm achievements).
    default: true
  hcm.guide.use:
    description: Open the How It Works guide (/hcm guide).
    default: true
  hcm.courier.use:
    description: >-
      Take and hand in Courier delivery runs. The board is a Site on the PC; the
      /hcm courier subcommand is admin/testing only.
    default: true
