<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #0e1116; --panel: #171c24; --panel2: #1e242e; --line: #2a313c;
    --text: #e7edf5; --muted: #93a1b3; --up: #33d17a; --down: #ff6b6b;
    --accent: #f6a821; --chart: #6aa8ff;
    /* live market (0.33): badge pills and chart markers; pills carry dark text in both themes */
    --hot: #f6a821; --wanted: #f5d547; --real: #b48cff; --season: #7cc4ff; --ink: #131922;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap;
    padding: 20px 24px; border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, #131922, #0e1116);
    position: sticky; top: 0; z-index: 5;
  }
  header .brand { font-size: 22px; font-weight: 800; letter-spacing: .3px; }
  header .brand .mk { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 13px; }
  header .status { margin-left: auto; color: var(--muted); font-size: 12px; }
  header .status .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--up); margin-right: 6px; vertical-align: middle;
  }
  main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }
  .grid {
    display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
  }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; gap: 10px;
  }
  .card .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .card .name { font-weight: 700; font-size: 16px; }
  .card .price { font-variant-numeric: tabular-nums; font-weight: 800; font-size: 20px; }
  .chg { font-size: 13px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--up); } .chg.down { color: var(--down); } .chg.flat { color: var(--muted); }
  .spread { display: flex; gap: 14px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .spread b { color: var(--text); font-weight: 600; }
  .stockrow { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .bar { height: 6px; border-radius: 4px; background: var(--panel2); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--chart); }
  .bar.out > span { background: var(--down); }
  .chartwrap { height: 90px; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  /* live market: the badge row on a card */
  .moodrow {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .moodrow[hidden] { display: none; }
  .moodrow .usual { margin-left: auto; }
  .moodrow .usual b { color: var(--text); font-weight: 600; }
  .pill {
    display: inline-block; padding: 1px 8px; border-radius: 999px; white-space: nowrap;
    font-size: 11px; font-weight: 800; letter-spacing: .3px; line-height: 1.5;
    color: var(--ink); background: var(--muted);
  }
  .pill.hot { background: var(--hot); }
  .pill.deal, .pill.up { background: var(--up); }
  .pill.down { background: var(--down); }
  .pill.wanted { background: var(--wanted); }
  .pill.real { background: var(--real); }
  .pill.season { background: var(--season); }
  /* live market: news bar (running events, season) and the headline ticker */
  .news {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    margin: 0 0 16px; overflow: hidden;
  }
  .news[hidden] { display: none; }
  .newsbar { display: flex; align-items: center; gap: 8px 10px; flex-wrap: wrap; padding: 10px 14px; }
  .newstag { font-weight: 800; font-size: 13px; letter-spacing: .3px; color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; min-width: 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; max-width: 100%;
    padding: 2px 10px 2px 3px; border-radius: 999px; background: var(--panel2);
    font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums;
  }
  .chip .when, .calm { color: var(--muted); }
  .calm { font-size: 12px; }
  .ticker { border-top: 1px solid var(--line); overflow: hidden; white-space: nowrap; padding: 8px 0; font-size: 13px; }
  .ticker[hidden] { display: none; }
  .ticker-track { display: inline-block; white-space: nowrap; }
  .ticker-track.run { animation: hcm-ticker linear infinite; will-change: transform; }
  .ticker:hover .ticker-track, .ticker:focus-within .ticker-track { animation-play-state: paused; }
  .tk-copy { display: inline-block; padding-left: 14px; }
  .tk { display: inline-flex; align-items: baseline; gap: 6px; margin-right: 32px; }
  .tk .line, .tk .ago { color: var(--muted); }
  .tk .ago { font-size: 12px; }
  @keyframes hcm-ticker { from { transform: translateX(0); } to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {
    .ticker { overflow-x: auto; }
    .ticker-track.run { animation: none; }
  }
  /* 48H / 7D / 30D */
  .toolbar { display: flex; justify-content: flex-end; margin: 0 0 12px; }
  .toolbar[hidden] { display: none; }
  .range { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .range button {
    padding: 5px 12px; border: 0; background: var(--panel); color: var(--muted); cursor: pointer;
    font: inherit; font-size: 12px; font-weight: 700; letter-spacing: .3px;
  }
  .range button + button { border-left: 1px solid var(--line); }
  .range button[aria-pressed="true"] { background: var(--panel2); color: var(--text); }
  .range button:disabled { opacity: .4; cursor: default; }
  .range button:focus-visible { outline: 2px solid var(--chart); outline-offset: -2px; }
  .lock {
    max-width: 460px; margin: 40px auto; padding: 18px 20px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .lock[hidden] { display: none; }
  .lock p { margin: 0; color: var(--muted); font-size: 14px; }
  .lock code { color: var(--text); }
  .lock .row { display: flex; gap: 8px; }
  .lock input {
    flex: 1; min-width: 0; padding: 8px 10px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--panel2); color: var(--text); font: inherit;
  }
  .lock input:focus { outline: 2px solid var(--chart); outline-offset: 1px; }
  .lock button {
    padding: 8px 16px; border: 0; border-radius: 8px; cursor: pointer;
    background: var(--accent); color: #131922; font: inherit; font-weight: 700;
  }
  footer { color: var(--muted); font-size: 12px; text-align: center; padding: 24px; }
  /* phones, with the live market on (html.live); with it off the page is 0.32's */
  @media (max-width: 480px) {
    html.live main { padding: 16px; }
    html.live .grid { grid-template-columns: minmax(0, 1fr); }
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fa; --panel: #ffffff; --panel2: #eef1f6; --line: #dfe4ec;
      --text: #131922; --muted: #5a6675; --chart: #2f6fed;
    }
    header { background: linear-gradient(180deg, #ffffff, #f4f6fa); }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><span class="mk" id="brandFirst"></span><span id="title"></span></div>
  <div class="sub">live commodities market</div>
  <div class="status"><span class="dot"></span><span id="status">connecting…</span></div>
</header>
<main>
  <form id="lock" class="lock" hidden autocomplete="off">
    <p>This dashboard needs the feed token (<code>web.dashboard.feed_token</code> in config.yml).</p>
    <div class="row">
      <input id="lockToken" type="password" aria-label="Feed token" placeholder="Feed token"
             autocomplete="off" spellcheck="false">
      <button type="submit">Unlock</button>
    </div>
  </form>
  <section id="news" class="news" hidden aria-label="Market news">
    <div class="newsbar"><span class="newstag">» Market News</span><span id="chips" class="chips"></span></div>
    <div id="ticker" class="ticker" hidden><div id="tickerTrack" class="ticker-track"></div></div>
  </section>
  <div id="toolbar" class="toolbar" hidden>
    <div id="range" class="range" role="group" aria-label="Chart range">
      <button type="button" data-range="48h" aria-pressed="true">48H</button>
      <button type="button" data-range="7d" aria-pressed="false">7D</button>
      <button type="button" data-range="30d" aria-pressed="false">30D</button>
    </div>
  </div>
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty" style="display:none">No commodities to show yet.</div>
</main>
<footer>HomeCraft Management · read-only market dashboard · auto-refreshing</footer>

<script>
(function () {
  var charts = {};       // id -> Chart instance
  var refreshMs = 30000; // updated from the feed
  var timer = null;
  var reqSeq = 0;        // only the newest request's answer counts (an Unlock can overtake a refresh)
  var lastFeed = null;   // the last /api/market answer (the range toggle redraws from it)
  var serverNow = 0;     // its generatedAt: "ends in" and "ago" count from the server's clock
  var lastNews = null;   // the last /api/news answer (drawn with the next market answer until a newer one comes)

  // The feed token (web.dashboard.feed_token), only needed when the server asks for it with a
  // 401. Kept in localStorage so it is asked for once; every access is guarded (private windows
  // and blocked storage throw), with an in-memory copy as the fallback. It is never displayed.
  var TOKEN_KEY = "hcmFeedToken";
  var UNAUTHORIZED = {};  // marker thrown on a 401
  var memToken = "";
  function loadToken() {
    try {
      var t = window.localStorage.getItem(TOKEN_KEY);
      if (t) return t;
    } catch (e) { /* storage unavailable: use the in-memory copy */ }
    return memToken;
  }
  function saveToken(t) {
    memToken = t;
    try { window.localStorage.setItem(TOKEN_KEY, t); } catch (e) { /* in-memory only */ }
  }
  function forgetToken() {
    memToken = "";
    try { window.localStorage.removeItem(TOKEN_KEY); } catch (e) { /* nothing stored */ }
  }

  // The chart range (48H / 7D / 30D), remembered per browser the same guarded way.
  var RANGE_KEY = "hcmChartRange";
  var RANGE_SERIES = { "48h": "history", "7d": "history7d", "30d": "history30d" };
  var available = { "48h": true, "7d": false, "30d": false }; // 7D/30D once the feed carries them
  function loadRange() {
    try {
      var r = window.localStorage.getItem(RANGE_KEY);
      if (r && has(RANGE_SERIES, r)) return r;
    } catch (e) { /* storage unavailable */ }
    return "48h";
  }
  function saveRange(r) {
    try { window.localStorage.setItem(RANGE_KEY, r); } catch (e) { /* this visit only */ }
  }
  var range = loadRange();
  function shownRange() { return available[range] ? range : "48h"; }

  // The live market's badges and news kinds. Pills and markers are styled per kind; anything
  // else a newer server might send is shown without a pill (or not at all, for markers).
  var KINDS = {
    hot: "★ HOT", deal: "✦ DEAL", up: "▲ UP", down: "▼ DOWN", wanted: "» WANTED",
    season: "SEASON", real: "REAL WORLD"
  };
  var BADGES = { hot: true, deal: true, up: true, down: true, wanted: true };
  var MOODS = { hot: true, deal: true, up: true, down: true };
  var MARKER_COLORS = { hot: "--hot", deal: "--up", up: "--up", down: "--down", real: "--real" };

  function has(o, k) { return typeof k === "string" && Object.prototype.hasOwnProperty.call(o, k); }
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function pad2(n) { return n.toString().padStart(2, "0"); }
  function money(n) {
    return "$" + Number(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function chgClass(v) { return v > 0.005 ? "up" : (v < -0.005 ? "down" : "flat"); }
  function chgText(v) {
    var s = v > 0 ? "▲ " : (v < 0 ? "▼ " : "· ");
    return s + Math.abs(v).toFixed(2) + "%";
  }
  function pctText(v) {
    if (!isNum(v) || Math.abs(v) < 0.05) return "0%";
    return (v > 0 ? "+" : "") + v.toFixed(1) + "%";
  }
  // The in-game wording (%hcm_endsin_<item>%): "20h" under two days, then "2d".
  function endsIn(ms) {
    if (!isNum(ms) || ms <= 0) return "";
    var hour = 3600000;
    if (ms < 48 * hour) return Math.max(1, Math.ceil(ms / hour)) + "h";
    return Math.round(ms / (24 * hour)) + "d";
  }
  // The in-game wording for news ages.
  function ago(ms) {
    if (!isNum(ms) || ms < 2 * 60000) return "just now";
    if (ms < 3600000) return Math.floor(ms / 60000) + "m ago";
    if (ms < 86400000) return Math.floor(ms / 3600000) + "h ago";
    if (ms < 2 * 86400000) return "yesterday";
    return Math.floor(ms / 86400000) + " days ago";
  }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function pill(kind, extra) {
    if (!has(KINDS, kind)) return null;
    return el("span", "pill " + kind, KINDS[kind] + (extra ? " · " + extra : ""));
  }

  function cardFor(item) {
    var card = document.createElement("div");
    card.className = "card";
    card.id = "card-" + item.id;
    var maxPct = item.maxStock > 0 ? Math.max(0, Math.min(100, (item.stock / item.maxStock) * 100)) : 0;
    var out = item.stock <= 0;
    card.innerHTML =
      '<div class="top"><span class="name"></span><span class="price"></span></div>' +
      '<div class="moodrow" hidden><span class="badge"></span><span class="usual"></span></div>' +
      '<div class="top"><span class="spread"><span>Buy <b class="buy"></b></span>' +
        '<span>Sell <b class="sell"></b></span></span><span class="chg"></span></div>' +
      '<div class="chartwrap"><canvas></canvas></div>' +
      '<div class="stockrow"><span>Stock</span><span class="stocktxt"></span></div>' +
      '<div class="bar' + (out ? " out" : "") + '"><span style="width:' + maxPct + '%"></span></div>';
    return card;
  }

  function updateCard(card, item) {
    card.querySelector(".name").textContent = item.name;
    card.querySelector(".price").textContent = money(item.price);
    card.querySelector(".buy").textContent = money(item.buy);
    card.querySelector(".sell").textContent = money(item.sell);
    var chg = card.querySelector(".chg");
    chg.textContent = chgText(item.change24h);
    chg.className = "chg " + chgClass(item.change24h);
    var out = item.stock <= 0;
    card.querySelector(".stocktxt").textContent =
      out ? "OUT OF STOCK" : (item.stock.toLocaleString() + " / " + item.maxStock.toLocaleString());
    var bar = card.querySelector(".bar");
    var maxPct = item.maxStock > 0 ? Math.max(0, Math.min(100, (item.stock / item.maxStock) * 100)) : 0;
    bar.className = "bar" + (out ? " out" : "");
    bar.querySelector("span").style.width = maxPct + "%";
    updateMood(card, item);
    drawChart(card.querySelector("canvas"), item);
  }

  // The live market's line on a card: the badge (with "ends in" while it has an end) and
  // "Usually $X" when the price is 3% or more away from usual. Hidden when the feed has neither.
  function updateMood(card, item) {
    var row = card.querySelector(".moodrow");
    var badge = card.querySelector(".badge");
    var usual = card.querySelector(".usual");
    badge.textContent = "";
    usual.textContent = "";
    var shown = false;
    if (has(BADGES, item.status)) {
      var left = isNum(item.statusEndsAt) ? endsIn(item.statusEndsAt - serverNow) : "";
      badge.appendChild(pill(item.status, left ? "ends in " + left : ""));
      shown = true;
    }
    if (isNum(item.usual) && isNum(item.moodPct) && Math.abs(item.moodPct) >= 3) {
      usual.appendChild(document.createTextNode("Usually "));
      usual.appendChild(el("b", null, money(item.usual)));
      shown = true;
    }
    row.hidden = !shown;
  }

  // The points the chart shows for the chosen range: history (48H), history7d or history30d,
  // falling back to history for an item the feed has no long range for yet.
  function seriesFor(item) {
    var s = item[RANGE_SERIES[shownRange()]];
    if (Array.isArray(s) && s.length) return s;
    return Array.isArray(item.history) ? item.history : [];
  }
  function pointLabel(t, r) {
    var d = new Date(t);
    var hm = pad2(d.getHours()) + ":" + pad2(d.getMinutes());
    return r === "48h" ? hm : d.toLocaleDateString(undefined, { month: "short", day: "numeric" }) + " " + hm;
  }
  function nearestIndex(points, t) {
    var lo = 0, hi = points.length - 1;
    while (hi - lo > 1) {
      var mid = (lo + hi) >> 1;
      if (points[mid].t <= t) lo = mid; else hi = mid;
    }
    return Math.abs(points[hi].t - t) < Math.abs(points[lo].t - t) ? hi : lo;
  }
  // Event markers (item.events, oldest first): a dot on the point nearest each event's start,
  // for events inside the range shown. None -> today's plain line.
  function markersFor(points, events) {
    var none = { radius: 0, color: undefined, border: undefined, text: null };
    if (!Array.isArray(events) || !events.length || !points.length) return none;
    var first = points[0].t, last = points[points.length - 1].t;
    var step = points.length > 1 ? (last - first) / (points.length - 1) : 30 * 60000;
    var radius = [], color = [], text = {}, any = false;
    for (var i = 0; i < points.length; i++) { radius.push(0); color.push("transparent"); }
    events.forEach(function (ev) {
      if (!ev || !isNum(ev.t) || !has(MARKER_COLORS, ev.kind)) return;
      if (ev.t < first - step || ev.t > last + step) return;
      var at = nearestIndex(points, ev.t);
      radius[at] = 4;
      color[at] = css(MARKER_COLORS[ev.kind]);
      text[at] = KINDS[ev.kind] + " " + pctText(ev.pct);
      any = true;
    });
    return any ? { radius: radius, color: color, border: css("--panel"), text: text } : none;
  }

  function drawChart(canvas, item) {
    var r = shownRange();
    var points = seriesFor(item);
    var labels = points.map(function (h) { return pointLabel(h.t, r); });
    var data = points.map(function (h) { return h.p; });
    // 48H keeps today's colour (the 24h change); 7D/30D colour by their own first-to-last move.
    var up = r === "48h" ? item.change24h >= 0
      : (points.length < 2 || points[points.length - 1].p >= points[0].p);
    var color = up ? css("--up") : css("--down");
    var marks = markersFor(points, item.events);
    var existing = charts[item.id];
    if (existing) {
      var ds = existing.data.datasets[0];
      existing.data.labels = labels;
      ds.data = data;
      ds.borderColor = color;
      ds.pointRadius = marks.radius;
      ds.pointBackgroundColor = marks.color;
      ds.pointBorderColor = marks.border;
      ds.markers = marks.text;
      existing.update("none");
      return;
    }
    charts[item.id] = new Chart(canvas.getContext("2d"), {
      type: "line",
      data: { labels: labels, datasets: [{
        data: data, borderColor: color, borderWidth: 2,
        pointRadius: marks.radius, pointBackgroundColor: marks.color,
        pointBorderColor: marks.border, pointBorderWidth: 1.5,
        tension: 0.25, fill: false, markers: marks.text
      }] },
      options: {
        responsive: true, maintainAspectRatio: false, animation: false,
        plugins: { legend: { display: false }, tooltip: {
          callbacks: {
            label: function (c) { return money(c.parsed.y); },
            afterLabel: function (c) {
              var m = c.dataset.markers;
              return m && m[c.dataIndex] ? m[c.dataIndex] : "";
            }
          }
        } },
        scales: {
          x: { display: false },
          y: { display: true, ticks: { color: css("--muted"), maxTicksLimit: 3,
                 callback: function (v) { return "$" + v; } },
               grid: { color: css("--line") } }
        }
      }
    });
  }

  function redrawCharts() {
    if (!lastFeed) return;
    (lastFeed.items || []).forEach(function (item) {
      var card = document.getElementById("card-" + item.id);
      if (card) drawChart(card.querySelector("canvas"), item);
    });
  }

  // The 48H/7D/30D toggle: part of the live market's page, so shown only while the feed says the
  // market is live and carries a long range; a range no item has is off. With the market off or
  // paused there is no toggle and every chart is the 48-hour line, as in 0.32 (whose feed already
  // carried history7d/history30d for the website without the page drawing them).
  function updateRanges(items, live) {
    available["7d"] = live && items.some(function (i) { return Array.isArray(i.history7d) && i.history7d.length > 0; });
    available["30d"] = live && items.some(function (i) { return Array.isArray(i.history30d) && i.history30d.length > 0; });
    document.getElementById("toolbar").hidden = !(available["7d"] || available["30d"]);
    var r = shownRange();
    Array.prototype.forEach.call(document.querySelectorAll("#range button"), function (b) {
      var id = b.getAttribute("data-range");
      b.disabled = !available[id];
      b.setAttribute("aria-pressed", id === r ? "true" : "false");
    });
  }

  document.getElementById("range").addEventListener("click", function (ev) {
    var b = ev.target && ev.target.closest ? ev.target.closest("button[data-range]") : null;
    if (!b || b.disabled) return;
    range = b.getAttribute("data-range");
    saveRange(range);
    if (lastFeed) {
      updateRanges(lastFeed.items || [], lastFeed.live === true);
      redrawCharts();
    }
  });

  // ---- live market news ------------------------------------------------------------------

  // What the news bar shows: /api/news when it answered; else the market feed's own copy (its
  // five newest, badges from the cards) while it says the market is live; else nothing.
  function newsSource(feed, news) {
    if (news && typeof news === "object" && typeof news.live === "boolean") {
      return news.live ? news : null;
    }
    if (feed.live !== true) return null;
    var active = (feed.items || []).filter(function (i) { return has(MOODS, i.status); }).map(function (i) {
      return { item: i.id, name: i.name, kind: i.status, pct: i.moodPct, endsAt: i.statusEndsAt };
    });
    return { live: true, season: feed.season, active: active, news: feed.news };
  }

  function chip(kind, text, when) {
    var c = el("span", "chip");
    var p = pill(kind);
    if (p) c.appendChild(p);
    c.appendChild(el("span", null, text));
    if (when) c.appendChild(el("span", "when", when));
    return c;
  }

  function renderNews(feed, news) {
    var box = document.getElementById("news");
    var src = newsSource(feed, news);
    if (!src) {
      box.hidden = true;
      renderTicker([]);
      return;
    }
    box.hidden = false;
    var chips = document.getElementById("chips");
    chips.textContent = "";
    var season = src.season;
    if (season && typeof season.name === "string") {
      var sLeft = isNum(season.endsAt) ? endsIn(season.endsAt - serverNow) : "";
      chips.appendChild(chip("season", season.name, sLeft ? "ends in " + sLeft : ""));
    }
    (Array.isArray(src.active) ? src.active : []).forEach(function (a) {
      if (!a || !has(MOODS, a.kind)) return;
      var left = isNum(a.endsAt) ? endsIn(a.endsAt - serverNow) : "";
      chips.appendChild(chip(a.kind, (a.name || a.item || "") + " " + pctText(a.pct), left ? "ends in " + left : ""));
    });
    var rows = (Array.isArray(src.news) ? src.news : []).filter(function (n) {
      return n && (typeof n.headline === "string" && n.headline || typeof n.line === "string" && n.line);
    });
    if (!chips.children.length && !rows.length) {
      chips.appendChild(el("span", "calm", "The Crate Market is calm today."));
    }
    renderTicker(rows);
  }

  function tickerItem(n) {
    var item = el("span", "tk");
    var p = pill(n.kind);
    if (p) item.appendChild(p);
    var head = n.headline || n.line;
    item.appendChild(el("span", "head", head));
    if (n.headline && n.line && n.line !== n.headline) item.appendChild(el("span", "line", n.line));
    item.appendChild(el("span", "ago", ""));
    return item;
  }

  // The headline ticker scrolls (two identical copies, moved left by one copy's width) when it
  // is wider than the bar; it pauses on hover, and stands still (scrollable) with reduced motion.
  // It is rebuilt only when the news changes, so a refresh does not restart the scroll.
  var tickerSig = null;
  var reduceMotion = false;
  try {
    reduceMotion = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
  } catch (e) { /* assume motion is fine */ }

  function renderTicker(rows) {
    var box = document.getElementById("ticker");
    var track = document.getElementById("tickerTrack");
    if (!rows.length) {
      box.hidden = true;
      track.textContent = "";
      track.className = "ticker-track";
      tickerSig = null;
      return;
    }
    box.hidden = false;
    var sig = JSON.stringify(rows.map(function (n) { return [n.id, n.kind, n.headline, n.line]; }));
    var changed = sig !== tickerSig;
    if (changed) {
      tickerSig = sig;
      track.textContent = "";
      var copy = el("span", "tk-copy");
      rows.forEach(function (n) { copy.appendChild(tickerItem(n)); });
      track.appendChild(copy);
    }
    // Only the ages move between refreshes: set them in place in every copy.
    Array.prototype.forEach.call(track.querySelectorAll(".tk-copy"), function (copy) {
      var ages = copy.querySelectorAll(".ago");
      rows.forEach(function (n, i) {
        if (ages[i]) ages[i].textContent = isNum(n.t) ? ago(serverNow - n.t) : "";
      });
    });
    if (changed) layoutTicker();
  }

  function layoutTicker() {
    var box = document.getElementById("ticker");
    var track = document.getElementById("tickerTrack");
    var copies = track.querySelectorAll(".tk-copy");
    if (!copies.length || box.hidden) return;
    for (var i = copies.length - 1; i > 0; i--) copies[i].remove(); // back to one copy
    track.className = "ticker-track";
    track.style.animationDuration = "";
    var width = copies[0].getBoundingClientRect().width;
    if (reduceMotion || width <= box.clientWidth) return; // it fits, or motion is off: stand still
    var clone = copies[0].cloneNode(true);
    clone.setAttribute("aria-hidden", "true");
    track.appendChild(clone);
    track.style.animationDuration = Math.max(20, Math.round(width / 60)) + "s"; // about 60 px a second
    track.className = "ticker-track run";
  }

  var resizeTimer = null;
  window.addEventListener("resize", function () {
    if (resizeTimer) clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function () { resizeTimer = null; layoutTicker(); }, 200);
  });

  function showTitle(fullTitle) {
    // Accent the first word, plain-text the rest.
    var sp = fullTitle.indexOf(" ");
    var first = sp === -1 ? fullTitle : fullTitle.slice(0, sp);
    var rest = sp === -1 ? "" : fullTitle.slice(sp); // keeps the leading space
    document.getElementById("brandFirst").textContent = first;
    document.getElementById("title").textContent = rest;
    document.title = fullTitle;
  }

  function render(feed) {
    // Show the configured title from the feed.
    showTitle(feed.title || "Market");
    refreshMs = Math.max(2, feed.refreshSeconds || 30) * 1000;
    serverNow = isNum(feed.generatedAt) ? feed.generatedAt : Date.now();
    lastFeed = feed;
    var live = feed.live === true;
    if (!live) lastNews = null; // off or paused: nothing of the live market's is kept or shown
    document.documentElement.classList.toggle("live", live);
    var grid = document.getElementById("grid");
    var items = feed.items || [];
    document.getElementById("empty").style.display = items.length ? "none" : "block";
    updateRanges(items, live);
    var seen = {};
    items.forEach(function (item) {
      seen[item.id] = true;
      var card = document.getElementById("card-" + item.id);
      if (!card) { card = cardFor(item); grid.appendChild(card); }
      updateCard(card, item);
    });
    // Remove cards for items no longer present.
    Array.prototype.slice.call(grid.children).forEach(function (card) {
      var id = card.id.replace("card-", "");
      if (!seen[id]) { if (charts[id]) { charts[id].destroy(); delete charts[id]; } card.remove(); }
    });
    // The news bar is extra: whatever goes wrong there, the prices above still count. It is
    // drawn now from the last /api/news answer (or the feed's own copy), and again when this
    // refresh's news arrives (fetchNews).
    drawNews(feed, lastNews && lastNews.live === true ? lastNews : null);
    var now = new Date();
    document.getElementById("status").textContent =
      "updated " + now.getHours().toString().padStart(2, "0") + ":" +
      now.getMinutes().toString().padStart(2, "0") + ":" + now.getSeconds().toString().padStart(2, "0");
  }

  function schedule() {
    if (timer) clearTimeout(timer);
    timer = setTimeout(tick, refreshMs);
  }

  function drawNews(feed, news) {
    try { renderNews(feed, news); } catch (e) { document.getElementById("news").hidden = true; }
  }

  // The live market's news (/api/news), with the same token. It is fetched only while the market
  // feed says the market is live, and only after the cards are drawn and the next refresh is
  // scheduled, so a slow, failing or hung news request can never hold back the prices or stop the
  // refresh loop. A news request still waiting when the next refresh starts is cancelled, and none
  // waits longer than NEWS_TIMEOUT_MS, so a stalled one never ties up the browser's connections.
  // An error, a refusal or a timeout leaves the news bar to the market feed's own copy.
  var NEWS_TIMEOUT_MS = 10000;
  var newsAbort = null;
  function cancelNews() {
    if (newsAbort) { var a = newsAbort; newsAbort = null; a(); }
  }
  function fetchNews(seq, headers) {
    cancelNews();
    var opts = { cache: "no-store", headers: headers };
    var ctl = null, killer = null;
    if (typeof AbortController === "function") {
      ctl = new AbortController();
      opts.signal = ctl.signal;
      killer = setTimeout(function () { ctl.abort(); }, NEWS_TIMEOUT_MS);
    }
    var mine = function () { if (killer) clearTimeout(killer); if (ctl) ctl.abort(); };
    newsAbort = mine;
    fetch("/api/news", opts)
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (news) {
        if (killer) clearTimeout(killer);
        if (newsAbort === mine) newsAbort = null;
        if (seq !== reqSeq || !lastFeed) return; // a newer request owns the page now
        lastNews = news && typeof news === "object" ? news : null;
        drawNews(lastFeed, lastNews);
      });
  }

  // A 401: stop refreshing, hide the stale cards and news and ask for the token.
  function showLock(rejected, why) {
    if (timer) { clearTimeout(timer); timer = null; }
    cancelNews();
    document.getElementById("grid").style.display = "none";
    document.getElementById("empty").style.display = "none";
    document.getElementById("news").hidden = true;
    document.getElementById("toolbar").hidden = true;
    document.getElementById("status").textContent = why || (rejected ? "token not accepted" : "locked");
    var lock = document.getElementById("lock");
    lock.hidden = false;
    document.getElementById("lockToken").focus();
  }
  function hideLock() {
    document.getElementById("lock").hidden = true;
    document.getElementById("grid").style.display = "";
  }

  function tick() {
    var seq = ++reqSeq;
    cancelNews(); // its answer would be for an older request
    var token = loadToken();
    var headers = {};
    if (token) {
      // The page can only send plain ASCII in a header (the feed_token rule in config.yml).
      if (/[^\x20-\x7e]/.test(token)) {
        forgetToken();
        showLock(true, "the token must be plain letters, digits and punctuation");
        return;
      }
      headers["Authorization"] = "Bearer " + token;
    }
    fetch("/api/market", { cache: "no-store", headers: headers })
      .then(function (r) {
        if (seq !== reqSeq) return null; // overtaken by a newer request
        if (r.status === 401) throw UNAUTHORIZED;
        return r.json();
      })
      .then(function (feed) {
        if (seq !== reqSeq || feed === null) return;
        hideLock();
        render(feed);
        schedule();
        if (feed.live === true) fetchNews(seq, headers);
      })
      .catch(function (e) {
        if (seq !== reqSeq) return; // a newer request owns the page now
        if (e === UNAUTHORIZED) {
          forgetToken();
          showLock(!!token);
          return;
        }
        document.getElementById("status").textContent = "offline — retrying…";
        schedule();
      });
  }

  document.getElementById("lock").addEventListener("submit", function (ev) {
    ev.preventDefault();
    var input = document.getElementById("lockToken");
    var t = input.value.trim();
    input.value = "";
    if (!t) { input.focus(); return; }
    saveToken(t);
    document.getElementById("status").textContent = "connecting…";
    tick();
  });

  showTitle(document.title || "Market"); // the page's own title until a feed arrives (or while locked)
  tick();
})();
</script>
</body>
</html>
